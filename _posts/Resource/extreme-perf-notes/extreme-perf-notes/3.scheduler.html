      class TaskScheduler {
        // 任务队列
        constructor() {
          this.tasks = [];
          this.isRunning = false;
        }

        // 添加任务
        postTask(callback, priority = "low") {
          this.tasks.push({ callback, priority });

          if (!this.isRunning) {
            this.isRunning = true;
            // 关键，通过 requestIdleCallback
            requestIdleCallback(this.run.bind(this));
          }
        }

        // 执行任务
        // 每个任务可能都有过期时间，一定要在过期之前，将它执行
        run(deadline) {
          while (this.tasks.length > 0 /*  && deadline.timeRemaining() > 1 */) {
            const task = this.tasks.shift(); // 因为 shift 是从前面取
            task.callback();
          }

          if (this.tasks.length > 0) {
            requestIdleCallback(this.run.bind(this));
          } else {
            this.isRunning = false;
          }
        }
      }

      const scheduler = new TaskScheduler();
      const bigArray = new Array(100000).fill(0);

      for (let i = 0; i < bigArray.length; i++) {
        const element = bigArray[i];
        scheduler.postTask(() => {
          console.log(element);
        });
