<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2869C8"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D13B32"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Left: issue input -->
  <rect x="28" y="42" width="330" height="680" rx="18" fill="#F8F5FF" stroke="#7048B7" stroke-width="2"/>
  <text x="193" y="102" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#452087">问题输入</text>

  <rect x="66" y="150" width="254" height="100" rx="14" fill="#FFFFFF" stroke="#7048B7" stroke-width="2.5"/>
  <text x="193" y="211" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#262A33">接收验收问题</text>

  <line x1="193" y1="250" x2="193" y2="326" stroke="#344054" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <rect x="66" y="338" width="254" height="100" rx="14" fill="#FFFFFF" stroke="#7048B7" stroke-width="2.5"/>
  <text x="193" y="399" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#262A33">保存修改前快照</text>

  <line x1="193" y1="438" x2="193" y2="510" stroke="#7048B7" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-dark)"/>
  <rect x="104" y="522" width="178" height="78" rx="12" fill="#FFFFFF" stroke="#7048B7" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="193" y="571" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#37304A">必要时恢复</text>

  <!-- Middle: workspace in-place update -->
  <rect x="390" y="42" width="714" height="680" rx="18" fill="#FFF8F0" stroke="#E07418" stroke-width="2"/>
  <text x="747" y="102" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#B74C08">当前工作区：原位更新</text>

  <rect x="548" y="145" width="398" height="92" rx="14" fill="#FFFFFF" stroke="#E07418" stroke-width="2.5"/>
  <text x="747" y="202" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#262A33">定位最早受影响阶段</text>
  <line x1="747" y1="237" x2="747" y2="292" stroke="#344054" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <rect x="420" y="305" width="654" height="212" rx="18" fill="#FFFCF7" stroke="#E07418" stroke-width="3" stroke-dasharray="10 8"/>

  <g font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#30343B" text-anchor="middle">
    <rect x="438" y="356" width="82" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="479" y="405">需求</text>
    <rect x="543" y="356" width="82" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="584" y="405">方案</text>
    <rect x="648" y="356" width="82" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="689" y="405">Task</text>
    <rect x="753" y="356" width="92" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="799" y="390">Test</text>
    <text x="799" y="416">Case</text>
    <rect x="868" y="356" width="82" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="909" y="405">代码</text>
    <rect x="973" y="356" width="82" height="82" rx="12" fill="#FFFFFF" stroke="#D88A45" stroke-width="2"/>
    <text x="1014" y="390">验证</text>
    <text x="1014" y="416">记录</text>
  </g>

  <g stroke="#344054" stroke-width="2.5" marker-end="url(#arrow-dark)">
    <line x1="520" y1="397" x2="535" y2="397"/>
    <line x1="625" y1="397" x2="640" y2="397"/>
    <line x1="730" y1="397" x2="745" y2="397"/>
    <line x1="845" y1="397" x2="860" y2="397"/>
    <line x1="950" y1="397" x2="965" y2="397"/>
  </g>

  <path d="M520 476 H974 M520 476 V459 M974 476 V459 M747 476 V492" fill="none" stroke="#C65C0D" stroke-width="3"/>
  <text x="747" y="544" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#C65C0D">按影响范围同步更新相关产物和代码</text>
  <text x="747" y="588" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="22" fill="#695547">在原交付链中更新，不另建平行记录</text>

  <!-- Right: rerun and gate -->
  <rect x="1136" y="42" width="436" height="680" rx="18" fill="#F3F8FF" stroke="#2869C8" stroke-width="2"/>
  <text x="1354" y="102" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#1754A5">重新执行与验收</text>

  <rect x="1182" y="145" width="344" height="86" rx="14" fill="#FFFFFF" stroke="#2869C8" stroke-width="2.5"/>
  <text x="1354" y="198" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#262A33">从受影响阶段重新执行</text>
  <line x1="1354" y1="231" x2="1354" y2="272" stroke="#2869C8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="1182" y="284" width="344" height="86" rx="14" fill="#FFFFFF" stroke="#2869C8" stroke-width="2.5"/>
  <text x="1354" y="337" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#262A33">重跑相关 Test Case</text>
  <line x1="1354" y1="370" x2="1354" y2="406" stroke="#2869C8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <polygon points="1354,414 1490,482 1354,550 1218,482" fill="#FFFFFF" stroke="#2869C8" stroke-width="3"/>
  <text x="1354" y="491" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#262A33">Gate 是否通过</text>

  <line x1="1354" y1="550" x2="1354" y2="600" stroke="#2E7D32" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1374" y="582" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#2E7D32">通过</text>
  <rect x="1222" y="612" width="264" height="80" rx="14" fill="#EDF8EE" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="1354" y="662" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#245D29">写回处理结果</text>

  <!-- Main connections -->
  <path d="M320 200 H548" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <path d="M1074 397 H1118 V188 H1182" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <!-- Failed loop: never enters success result -->
  <path d="M1218 482 H1118 V640 H747 V529" fill="none" stroke="#D13B32" stroke-width="4" marker-end="url(#arrow-red)"/>
  <rect x="855" y="618" width="268" height="44" rx="10" fill="#FFF3F1"/>
  <text x="989" y="647" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#B82C26">未通过：重新定位并补充更新</text>

  <!-- Outcome -->
  <rect x="28" y="758" width="1544" height="110" rx="16" fill="#F3FAF3" stroke="#3E8B45" stroke-width="2"/>
  <text x="280" y="826" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#26362B">保持产物与代码一致</text>
  <circle cx="548" cy="815" r="6" fill="#3E8B45"/>
  <text x="800" y="826" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#26362B">避免只改代码不复验</text>
  <circle cx="1052" cy="815" r="6" fill="#3E8B45"/>
  <text x="1300" y="826" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#26362B">保留完整返修记录</text>
</svg>
