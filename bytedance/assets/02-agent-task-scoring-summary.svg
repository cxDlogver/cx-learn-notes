<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #273142; }
      .title { font-size: 36px; font-weight: 600; }
      .subtitle { font-size: 18px; fill: #667085; }
      .step { font-size: 14px; font-weight: 600; fill: #FFFFFF; letter-spacing: .5px; }
      .node-title { font-size: 22px; font-weight: 600; }
      .node-text { font-size: 15px; fill: #475467; }
      .chip { font-size: 15px; font-weight: 500; }
      .principle-title { font-size: 20px; font-weight: 600; }
      .principle-text { font-size: 15px; fill: #475467; }
      .result-title { font-size: 22px; font-weight: 600; fill: #FFFFFF; }
      .result-text { font-size: 16px; fill: #E8F0FF; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98A2B3"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>
  <text x="70" y="68" class="title">企业 Agent 任务评分框架</text>
  <text x="70" y="104" class="subtitle">从任务成功条件出发，用可核验事实选择计分方式并形成评测结论</text>

  <rect x="70" y="150" width="1460" height="64" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <text x="98" y="190" class="node-title">评分起点</text>
  <text x="236" y="190" class="node-text">先定义目标、允许操作、禁止条件和成功标准，再决定收集什么证据</text>

  <!-- task contract -->
  <rect x="55" y="280" width="220" height="285" rx="20" fill="#EAF2FF" stroke="#4C78C2" stroke-width="3"/>
  <rect x="78" y="304" width="70" height="28" rx="14" fill="#4C78C2"/>
  <text x="113" y="324" text-anchor="middle" class="step">STEP 1</text>
  <text x="78" y="370" class="node-title">任务合同</text>
  <text x="78" y="408" class="node-text">目标与初始状态</text>
  <text x="78" y="438" class="node-text">工具与权限</text>
  <text x="78" y="468" class="node-text">成功 / 禁止条件</text>
  <text x="78" y="498" class="node-text">预算与运行次数</text>

  <!-- evidence -->
  <rect x="315" y="280" width="220" height="285" rx="20" fill="#F3EEFF" stroke="#7A5AF8" stroke-width="3"/>
  <rect x="338" y="304" width="70" height="28" rx="14" fill="#7A5AF8"/>
  <text x="373" y="324" text-anchor="middle" class="step">STEP 2</text>
  <text x="338" y="370" class="node-title">证据采集</text>
  <rect x="338" y="397" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="425" y="423" text-anchor="middle" class="chip">结果与环境状态</text>
  <rect x="338" y="447" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="425" y="473" text-anchor="middle" class="chip">执行轨迹</text>
  <rect x="338" y="497" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="425" y="523" text-anchor="middle" class="chip">审计与副作用</text>

  <!-- criteria -->
  <rect x="575" y="280" width="220" height="285" rx="20" fill="#FFF7E0" stroke="#B58B22" stroke-width="3"/>
  <rect x="598" y="304" width="70" height="28" rx="14" fill="#B58B22"/>
  <text x="633" y="324" text-anchor="middle" class="step">STEP 3</text>
  <text x="598" y="370" class="node-title">评分标准</text>
  <text x="598" y="408" class="node-text">标准答案</text>
  <text x="598" y="438" class="node-text">目标状态 / 测试</text>
  <text x="598" y="468" class="node-text">Rubric</text>
  <text x="598" y="498" class="node-text">Policy</text>

  <!-- grader -->
  <rect x="835" y="280" width="220" height="285" rx="20" fill="#F3EEFF" stroke="#7A5AF8" stroke-width="3"/>
  <rect x="858" y="304" width="70" height="28" rx="14" fill="#7A5AF8"/>
  <text x="893" y="324" text-anchor="middle" class="step">STEP 4</text>
  <text x="858" y="370" class="node-title">计分器选择</text>
  <rect x="858" y="397" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="945" y="423" text-anchor="middle" class="chip">确定性规则</text>
  <rect x="858" y="447" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="945" y="473" text-anchor="middle" class="chip">模型评分</text>
  <rect x="858" y="497" width="174" height="40" rx="11" fill="#E8DFFF"/>
  <text x="945" y="523" text-anchor="middle" class="chip">人工复核</text>

  <!-- aggregation -->
  <rect x="1095" y="280" width="220" height="285" rx="20" fill="#EAF2FF" stroke="#4C78C2" stroke-width="3"/>
  <rect x="1118" y="304" width="70" height="28" rx="14" fill="#4C78C2"/>
  <text x="1153" y="324" text-anchor="middle" class="step">STEP 5</text>
  <text x="1118" y="370" class="node-title">结果汇总</text>
  <text x="1118" y="408" class="node-text">单次运行结果</text>
  <text x="1118" y="438" class="node-text">多次运行稳定性</text>
  <text x="1118" y="468" class="node-text">任务集聚合</text>
  <text x="1118" y="498" class="node-text">失败类型</text>

  <!-- conclusion -->
  <rect x="1355" y="280" width="190" height="285" rx="20" fill="#273142"/>
  <rect x="1378" y="304" width="70" height="28" rx="14" fill="#4C78C2"/>
  <text x="1413" y="324" text-anchor="middle" class="step">OUTPUT</text>
  <text x="1378" y="370" class="result-title">评测结论</text>
  <text x="1378" y="414" class="result-text">任务完成</text>
  <text x="1378" y="448" class="result-text">过程风险</text>
  <text x="1378" y="482" class="result-text">运行稳定性</text>
  <text x="1378" y="516" class="result-text">适用边界</text>

  <!-- arrows -->
  <path d="M 275 422 L 305 422" fill="none" stroke="#98A2B3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 535 422 L 565 422" fill="none" stroke="#98A2B3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 795 422 L 825 422" fill="none" stroke="#98A2B3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1055 422 L 1085 422" fill="none" stroke="#98A2B3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1315 422 L 1345 422" fill="none" stroke="#98A2B3" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- principle -->
  <rect x="160" y="655" width="1280" height="156" rx="22" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <text x="190" y="694" class="principle-title">计分器选择原则</text>
  <line x1="190" y1="713" x2="1410" y2="713" stroke="#E4E7EC"/>
  <circle cx="224" cy="756" r="9" fill="#4C78C2"/>
  <text x="246" y="762" class="principle-text">结果可以被代码或状态直接验证时，优先使用确定性规则</text>
  <circle cx="720" cy="756" r="9" fill="#7A5AF8"/>
  <text x="742" y="762" class="principle-text">开放内容按明确 Rubric 使用模型评分</text>
  <circle cx="1125" cy="756" r="9" fill="#C65A5A"/>
  <text x="1147" y="762" class="principle-text">高风险或评分冲突进入人工复核</text>
</svg>
