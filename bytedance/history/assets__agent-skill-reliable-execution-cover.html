<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>如何编写让 Agent 可靠执行的 Skill</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #06142a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .cover {
      position: relative;
      width: 1600px;
      height: 900px;
      color: #f7fbff;
      background-image:
        linear-gradient(90deg, rgba(4, 15, 34, .98) 0%, rgba(4, 15, 34, .94) 31%, rgba(4, 15, 34, .56) 49%, rgba(4, 15, 34, .05) 73%),
        url("../assets/agent-skill-reliable-execution-cover-background.png");
      background-size: cover;
      background-position: center;
    }
    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5, 16, 35, .1), rgba(5, 16, 35, .3)),
        radial-gradient(circle at 17% 44%, rgba(16, 116, 181, .16), transparent 36%);
    }
    .accent-line {
      position: absolute;
      top: 72px;
      left: 88px;
      width: 96px;
      height: 5px;
      border-radius: 4px;
      background: linear-gradient(90deg, #24c9ef 0 70%, #ffb454 70% 100%);
    }
    .content {
      position: absolute;
      z-index: 2;
      top: 112px;
      left: 88px;
      width: 700px;
    }
    .eyebrow {
      color: #6edcf5;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 3.6px;
      text-transform: uppercase;
    }
    h1 {
      margin: 42px 0 0;
      font-size: 72px;
      line-height: 1.18;
      letter-spacing: -2.2px;
      font-weight: 760;
      text-shadow: 0 6px 30px rgba(0, 0, 0, .28);
    }
    h1 .agent { color: #6edcf5; }
    h1 .skill { color: #ffc06b; }
    .subtitle {
      margin-top: 35px;
      padding-left: 18px;
      border-left: 4px solid #36c8e8;
      color: #c8d8e9;
      font-size: 29px;
      line-height: 1.5;
      font-weight: 480;
      letter-spacing: .5px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 42px;
      width: 590px;
    }
    .tag {
      padding: 10px 16px;
      border: 1px solid rgba(110, 220, 245, .34);
      border-radius: 999px;
      background: rgba(13, 48, 83, .52);
      color: #cfeaf3;
      font-size: 17px;
      line-height: 1;
      backdrop-filter: blur(8px);
    }
    .footer {
      position: absolute;
      z-index: 2;
      left: 88px;
      bottom: 67px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #8fa8c1;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .footer .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffb454;
    }
    .page-mark {
      position: absolute;
      z-index: 2;
      right: 72px;
      top: 64px;
      color: rgba(215, 235, 250, .64);
      font-size: 16px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="cover">
    <div class="accent-line"></div>
    <div class="page-mark">RESEARCH · DESIGN · PRACTICE</div>
    <section class="content">
      <div class="eyebrow">Agent Skill · Reliable Execution</div>
      <h1>如何编写让 <span class="agent">Agent</span><br />可靠执行的 <span class="skill">Skill</span></h1>
      <div class="subtitle">从自然语言软约束，到可验证、可回溯的 Gate</div>
      <div class="tags">
        <span class="tag">渐进式披露</span>
        <span class="tag">结构化合同</span>
        <span class="tag">脚本校验</span>
        <span class="tag">Gate 回溯</span>
      </div>
    </section>
    <footer class="footer">
      <span>转正答辩 · 调研分享</span>
      <span class="dot"></span>
      <span>2026.08</span>
    </footer>
  </main>
</body>
</html>
