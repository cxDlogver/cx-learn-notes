[package]
name = "wasm-image-gray"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 核心桥接库
wasm-bindgen = "0.2"

# 错误处理钩子 (让 Rust panic 在控制台可见)
console_error_panic_hook = "0.1.6"

# 图像处理库 (关闭默认功能以减小体积，只开启需要的格式)
[dependencies.image]
version = "0.24"
default-features = false
features = ["jpeg", "png", "gif"]