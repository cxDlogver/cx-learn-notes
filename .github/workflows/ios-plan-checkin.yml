name: iOS plan checkin static checks

on:
  push:
    paths:
      - "ios-plan-checkin/**"
      - ".github/workflows/ios-plan-checkin.yml"
  pull_request:
    paths:
      - "ios-plan-checkin/**"
      - ".github/workflows/ios-plan-checkin.yml"

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-plan-checkin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ios-plan-checkin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r docs/atdd/web/requirements.txt
      - run: pnpm check
      - run: pnpm web:atdd:check
        if: always()
