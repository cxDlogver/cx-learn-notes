<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">前端增量覆盖率 Skill 规范图</title>
  <desc id="desc">Skill 从华佗获取变更文件覆盖率并定位未覆盖行，选择最大缺口，结合验收项设计页面路径，通过 Chrome DevTools MCP 操作真实页面并刷新覆盖率报告。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1D2129" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
    <style>
      .title { font: 600 34px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #1D2129; }
      .subtitle { font: 400 22px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #667085; }
      .step { font: 600 18px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .node-title { font: 600 25px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #1D2129; text-anchor: middle; }
      .node-desc { font: 400 19px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #5C667A; text-anchor: middle; }
      .arrow { fill: none; stroke: #5B6B82; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #7B8794; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .loop-label { font: 500 18px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #667085; text-anchor: middle; }
      .callout { font: 500 22px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #8A3E3E; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1440" height="810" fill="#F7F8FA"/>
  <text class="title" x="70" y="72">前端增量覆盖率 Skill 规范</text>
  <text class="subtitle" x="70" y="111">先定位覆盖缺口，再通过 Chrome DevTools MCP 操作真实页面</text>

  <path class="arrow" d="M410 247.5 H550"/>
  <path class="arrow" d="M890 247.5 H1030"/>
  <path class="arrow" d="M1200 325 V450"/>
  <path class="arrow" d="M1030 527.5 H890"/>
  <path class="arrow" d="M550 527.5 H410"/>
  <path class="loop" d="M70 527.5 H28 V247.5 H70"/>
  <rect x="5" y="365" width="92" height="38" rx="10" fill="#F7F8FA"/>
  <text class="loop-label" x="51" y="391">未达标</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="340" height="155" rx="18" fill="#F1EEFF" stroke="#8A78D0" stroke-width="2"/>
    <circle cx="104" cy="204" r="18" fill="#6D5CA8"/>
    <text class="step" x="104" y="204">1</text>
    <text class="node-title" x="240" y="247">读取华佗覆盖率</text>
    <text class="node-desc" x="240" y="282">branch/files</text>
    <text class="node-desc" x="240" y="310">获取变更文件覆盖率</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="170" width="340" height="155" rx="18" fill="#F1EEFF" stroke="#8A78D0" stroke-width="2"/>
    <circle cx="584" cy="204" r="18" fill="#6D5CA8"/>
    <text class="step" x="584" y="204">2</text>
    <text class="node-title" x="720" y="247">定位未覆盖代码行</text>
    <text class="node-desc" x="720" y="282">branch/code</text>
    <text class="node-desc" x="720" y="310">读取文件覆盖明细</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="170" width="340" height="155" rx="18" fill="#EAF2FF" stroke="#6C93D2" stroke-width="2"/>
    <circle cx="1064" cy="204" r="18" fill="#4C78C2"/>
    <text class="step" x="1064" y="204">3</text>
    <text class="node-title" x="1200" y="247">选择最大覆盖缺口</text>
    <text class="node-desc" x="1200" y="282">过滤无新增代码</text>
    <text class="node-desc" x="1200" y="310">过滤生成文件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="450" width="340" height="155" rx="18" fill="#FFF3E8" stroke="#D89455" stroke-width="2"/>
    <circle cx="1064" cy="484" r="18" fill="#C47A2C"/>
    <text class="step" x="1064" y="484">4</text>
    <text class="node-title" x="1200" y="527">确定页面操作路径</text>
    <text class="node-desc" x="1200" y="562">结合未覆盖代码</text>
    <text class="node-desc" x="1200" y="590">结合需求验收项</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="450" width="340" height="155" rx="18" fill="#FDECEC" stroke="#D07171" stroke-width="2"/>
    <circle cx="584" cy="484" r="18" fill="#C65A5A"/>
    <text class="step" x="584" y="484">5</text>
    <text class="node-title" x="720" y="527">Chrome DevTools MCP</text>
    <text class="node-desc" x="720" y="562">自动点击、切换和提交</text>
    <text class="node-desc" x="720" y="590">触发真实页面代码分支</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="450" width="340" height="155" rx="18" fill="#EAF6EF" stroke="#62A47B" stroke-width="2"/>
    <circle cx="104" cy="484" r="18" fill="#3F8A5E"/>
    <text class="step" x="104" y="484">6</text>
    <text class="node-title" x="240" y="527">刷新覆盖率报告</text>
    <text class="node-desc" x="240" y="562">达到 90% 后结束</text>
    <text class="node-desc" x="240" y="590">未达标则继续处理</text>
  </g>

  <rect x="70" y="680" width="1300" height="70" rx="14" fill="#FDECEC"/>
  <text class="callout" x="720" y="724">查询接口保持真实请求｜写接口在浏览器网络层返回 Mock 响应</text>
</svg>
