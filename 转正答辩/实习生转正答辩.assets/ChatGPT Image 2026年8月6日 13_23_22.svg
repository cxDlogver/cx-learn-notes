<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">字段级与模块级权限范围</title>
  <desc id="desc">字段级权限对应八类数据维度，模块级权限对应两类固定页面模块；两类权限使用不同背景色区分。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718096"/>
    </marker>
    <style>
      .header { fill:#eef0f3; stroke:#8f99a7; stroke-width:1.1; }
      .header-text { font:600 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#273142; text-anchor:middle; }
      .field-zone { fill:#fffdfb; }
      .module-zone { fill:#fbfefc; }
      .scope { fill:#eaf2ff; stroke:#5d88c6; stroke-width:1.25; }
      .scope-text { font:600 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#244a7b; text-anchor:middle; }
      .state { fill:#fff; stroke:#a8b0bb; stroke-width:1.05; }
      .state-eye { fill:#fff8e9; stroke:#c4943e; }
      .state-person { fill:#f5f1ff; stroke:#8b75bd; }
      .state-permission { fill:#fff1e8; stroke:#c47a46; }
      .state-text { font:500 13px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#303846; text-anchor:middle; }
      .trunk { fill:none; stroke:#718096; stroke-width:1.35; }
      .branch { fill:none; stroke:#718096; stroke-width:1.35; marker-end:url(#arrow); }
      .field-dimension-card { fill:#fff4e9; stroke:#d7a06d; stroke-width:1.15; }
      .module-dimension-card { fill:#eef8f2; stroke:#86b597; stroke-width:1.15; }
      .field-dimension-frame { fill:none; stroke:#c8874a; stroke-width:1.5; }
      .module-dimension-frame { fill:none; stroke:#6f9f80; stroke-width:1.5; }
      .divider { stroke:#dfb892; stroke-width:1; }
      .module-divider { stroke:#a8cdb5; stroke-width:1; }
      .dimension-title { font:600 13.5px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#704720; text-anchor:start; }
      .module-title { font:600 13.5px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#356648; text-anchor:start; }
      .page { fill:none; stroke:#7197c9; stroke-width:1; }
      .module { fill:none; stroke:#70a183; stroke-width:1; }
      .page-text { font:500 11.3px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#31567e; text-anchor:middle; }
      .module-text { font:500 11.3px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#356648; text-anchor:middle; }
      .relation { fill:none; stroke:#718096; stroke-width:1.25; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- 三列标题 -->
  <rect x="24" y="24" width="180" height="60" class="header"/>
  <rect x="204" y="24" width="396" height="60" class="header"/>
  <rect x="620" y="24" width="956" height="60" class="header"/>
  <text x="114" y="61" class="header-text">管控粒度</text>
  <text x="402" y="61" class="header-text">四种权限状态</text>
  <text x="1098" y="61" class="header-text">多类数据维度及对应页面</text>

  <!-- 整行底色区分字段级与模块级 -->
  <rect x="24" y="96" width="1552" height="522" rx="8" class="field-zone"/>
  <rect x="24" y="632" width="1552" height="244" rx="8" class="module-zone"/>

  <!-- 字段级权限及四种纵向状态 -->
  <rect x="45" y="292" width="130" height="66" rx="8" class="scope"/>
  <text x="110" y="331" class="scope-text">字段级权限</text>

  <rect x="300" y="164" width="250" height="52" rx="7" class="state"/>
  <rect x="300" y="254" width="250" height="52" rx="7" class="state state-eye"/>
  <rect x="300" y="344" width="250" height="52" rx="7" class="state state-person"/>
  <rect x="300" y="434" width="250" height="52" rx="7" class="state state-permission"/>
  <text x="425" y="196" class="state-text">正常展示</text>
  <text x="425" y="286" class="state-text">需要点击查看</text>
  <text x="425" y="376" class="state-text">缺少协作人</text>
  <text x="425" y="466" class="state-text">缺少数据权限</text>
  <path d="M175 325 H240 M240 190 V460" class="trunk"/>
  <path d="M240 190 H300" class="branch"/>
  <path d="M240 280 H300" class="branch"/>
  <path d="M240 370 H300" class="branch"/>
  <path d="M240 460 H300" class="branch"/>
  <path d="M550 460 H615" class="branch"/>

  <!-- 模块级权限及四种纵向状态 -->
  <rect x="45" y="719" width="130" height="66" rx="8" class="scope"/>
  <text x="110" y="758" class="scope-text">模块级权限</text>

  <rect x="300" y="648" width="250" height="42" rx="7" class="state"/>
  <rect x="300" y="704" width="250" height="42" rx="7" class="state state-eye"/>
  <rect x="300" y="760" width="250" height="42" rx="7" class="state state-person"/>
  <rect x="300" y="816" width="250" height="42" rx="7" class="state state-permission"/>
  <text x="425" y="674" class="state-text">正常展示</text>
  <text x="425" y="730" class="state-text">需要点击查看</text>
  <text x="425" y="786" class="state-text">缺少协作人</text>
  <text x="425" y="842" class="state-text">缺少数据权限</text>
  <path d="M175 752 H240 M240 669 V837" class="trunk"/>
  <path d="M240 669 H300" class="branch"/>
  <path d="M240 725 H300" class="branch"/>
  <path d="M240 781 H300" class="branch"/>
  <path d="M240 837 H300" class="branch"/>
  <path d="M550 837 H585 V745 H615" class="branch"/>

  <!-- 字段级和模块级数据维度总框 -->
  <rect x="615" y="96" width="951" height="522" rx="12" class="field-dimension-frame"/>
  <rect x="615" y="650" width="951" height="170" rx="12" class="module-dimension-frame"/>

  <!-- 字段级：八类数据维度 -->
  <g transform="translate(642 106)">
    <rect x="-12" y="0" width="450" height="122" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">作者数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="45" width="140" height="30" rx="7" class="page"/>
    <text x="70" y="65" class="page-text">作者档案</text>
    <path d="M140 60 H160" class="relation"/>
    <rect x="169" y="45" width="126" height="30" rx="7" class="module"/>
    <text x="232" y="65" class="module-text">基础信息</text>
    <rect x="0" y="84" width="140" height="30" rx="7" class="page"/>
    <text x="70" y="104" class="page-text">达人库 / 号簇列表</text>
    <path d="M140 99 H160" class="relation"/>
    <rect x="169" y="84" width="126" height="30" rx="7" class="module"/>
    <text x="232" y="104" class="module-text">交易指标</text>
  </g>

  <g transform="translate(1118 106)">
    <rect x="-12" y="0" width="450" height="134" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">直播数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="40" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="57" class="page-text">作者档案</text>
    <path d="M136 52 H155" class="relation"/>
    <rect x="164" y="40" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="57" class="module-text">作者表现趋势</text>
    <rect x="0" y="72" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="89" class="page-text">直播分析</text>
    <path d="M136 84 H155" class="relation"/>
    <rect x="164" y="72" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="89" class="module-text">直播核心数据</text>
    <rect x="0" y="104" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="121" class="page-text">达人库 / 号簇列表</text>
    <path d="M136 116 H155" class="relation"/>
    <rect x="164" y="104" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="121" class="module-text">交易指标</text>
  </g>

  <g transform="translate(642 244)">
    <rect x="-12" y="0" width="450" height="134" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">视频数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="40" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="57" class="page-text">作者档案</text>
    <path d="M136 52 H155" class="relation"/>
    <rect x="164" y="40" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="57" class="module-text">作者表现趋势</text>
    <rect x="0" y="72" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="89" class="page-text">作品分析</text>
    <path d="M136 84 H155" class="relation"/>
    <rect x="164" y="72" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="89" class="module-text">核心数据</text>
    <rect x="0" y="104" width="136" height="25" rx="7" class="page"/>
    <text x="68" y="121" class="page-text">达人库 / 号簇列表</text>
    <path d="M136 116 H155" class="relation"/>
    <rect x="164" y="104" width="137" height="25" rx="7" class="module"/>
    <text x="232" y="121" class="module-text">交易指标</text>
  </g>

  <g transform="translate(1118 256)">
    <rect x="-12" y="0" width="450" height="110" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">商品数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="48" width="144" height="34" rx="7" class="page"/>
    <text x="72" y="70" class="page-text">商品分析</text>
    <path d="M144 65 H180" class="relation"/>
    <rect x="189" y="48" width="166" height="34" rx="7" class="module"/>
    <text x="272" y="70" class="module-text">成交商品明细</text>
  </g>

  <g transform="translate(642 394)">
    <rect x="-12" y="0" width="450" height="110" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">违规数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="48" width="128" height="34" rx="7" class="page"/>
    <text x="64" y="70" class="page-text">作者档案</text>
    <path d="M128 65 H150" class="relation"/>
    <rect x="159" y="48" width="112" height="34" rx="7" class="module"/>
    <rect x="282" y="48" width="112" height="34" rx="7" class="module"/>
    <text x="215" y="70" class="module-text">基础信息</text>
    <text x="338" y="70" class="module-text">风险信息</text>
  </g>

  <g transform="translate(1118 382)">
    <rect x="-12" y="0" width="450" height="110" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">佣金数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="48" width="144" height="34" rx="7" class="page"/>
    <text x="72" y="70" class="page-text">作品分析</text>
    <path d="M144 65 H180" class="relation"/>
    <rect x="189" y="48" width="166" height="34" rx="7" class="module"/>
    <text x="272" y="70" class="module-text">核心数据</text>
  </g>

  <g transform="translate(642 520)">
    <rect x="-12" y="0" width="450" height="92" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">作品违规数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="44" width="144" height="34" rx="7" class="page"/>
    <text x="72" y="66" class="page-text">作品分析</text>
    <path d="M144 61 H180" class="relation"/>
    <rect x="189" y="44" width="166" height="34" rx="7" class="module"/>
    <text x="272" y="66" class="module-text">作品列表</text>
  </g>

  <g transform="translate(1118 508)">
    <rect x="-12" y="0" width="450" height="92" rx="9" class="field-dimension-card"/>
    <text x="0" y="18" class="dimension-title">直播违规数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="divider"/>
    <rect x="0" y="44" width="144" height="34" rx="7" class="page"/>
    <text x="72" y="66" class="page-text">直播分析</text>
    <path d="M144 61 H180" class="relation"/>
    <rect x="189" y="44" width="166" height="34" rx="7" class="module"/>
    <text x="272" y="66" class="module-text">直播列表</text>
  </g>

  <!-- 模块级：两类固定页面映射 -->
  <g transform="translate(642 684)">
    <rect x="-12" y="0" width="450" height="122" rx="9" class="module-dimension-card"/>
    <text x="0" y="18" class="module-title">作者数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="module-divider"/>
    <rect x="0" y="52" width="144" height="38" rx="7" class="page"/>
    <text x="72" y="76" class="page-text">作者档案</text>
    <path d="M144 71 H184" class="relation"/>
    <rect x="193" y="52" width="182" height="38" rx="7" class="module"/>
    <text x="284" y="76" class="module-text">体裁经营概览</text>
  </g>

  <g transform="translate(1118 684)">
    <rect x="-12" y="0" width="450" height="122" rx="9" class="module-dimension-card"/>
    <text x="0" y="18" class="module-title">违规数据维度权限</text>
    <line x1="0" y1="30" x2="438" y2="30" class="module-divider"/>
    <rect x="0" y="52" width="112" height="38" rx="7" class="page"/>
    <text x="56" y="76" class="page-text">违规处罚</text>
    <path d="M112 71 H137" class="relation"/>
    <rect x="146" y="52" width="84" height="38" rx="7" class="module"/>
    <rect x="238" y="52" width="84" height="38" rx="7" class="module"/>
    <rect x="330" y="52" width="108" height="38" rx="7" class="module"/>
    <text x="188" y="76" class="module-text">近期处罚</text>
    <text x="280" y="76" class="module-text">处罚概览</text>
    <text x="384" y="76" class="module-text">处罚明细</text>
  </g>
</svg>
