<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">字段级与模块级权限公共能力框架</title>
  <desc id="desc">页面层分别提供字段原始值以及模块数据权限标识和当前作者 ID；公共层完成字段识别、模块权限查询和状态转换；页面依据结果接入字段级或模块级公共组件，由公共组件统一提供权限内容和操作入口。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      .panel { fill:#ffffff; stroke:#a5afbd; stroke-width:1.2; }
      .header { fill:#eef1f5; stroke:#8f9aa8; stroke-width:1.1; }
      .headerText { font:600 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#263244; text-anchor:middle; }
      .laneField { fill:#fff8f1; stroke:#e1ac70; stroke-width:1.05; }
      .laneModule { fill:#f2f9f5; stroke:#85aa92; stroke-width:1.05; }
      .pageCard { fill:#eef5ff; stroke:#7fa3d4; stroke-width:1.15; }
      .methodCard { fill:#ffffff; stroke:#a9b3c0; stroke-width:1.1; }
      .componentCard { fill:#f1f6ff; stroke:#6f94d0; stroke-width:1.25; }
      .resultCard { fill:#ffffff; stroke:#a8b2bf; stroke-width:1.05; }
      .entryCard { fill:#f7f3ff; stroke:#9b86c9; stroke-width:1.2; }
      .diamondField { fill:#fff2df; stroke:#c7924f; stroke-width:1.2; }
      .diamondModule { fill:#eaf6ef; stroke:#6e9c7e; stroke-width:1.2; }
      .laneLabelField { font:600 15px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#875327; }
      .laneLabelModule { font:600 15px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#356849; }
      .titleText { font:600 15px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#293548; text-anchor:middle; }
      .bodyText { font:500 13px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#3b4658; text-anchor:middle; }
      .smallText { font:400 11.5px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#647084; text-anchor:middle; }
      .codeText { font:600 11.5px Menlo,Consolas,monospace; fill:#3f4e65; text-anchor:middle; }
      .tinyCode { font:600 10.6px Menlo,Consolas,monospace; fill:#3f4e65; text-anchor:middle; }
      .stateText { font:500 11.2px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#5a6474; text-anchor:middle; }
      .branchText { font:500 11.5px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#576273; text-anchor:middle; }
      .line { fill:none; stroke:#64748b; stroke-width:1.55; marker-end:url(#arrow); }
      .subline { fill:none; stroke:#8390a2; stroke-width:1.25; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- 三个职责区 -->
  <rect x="24" y="24" width="320" height="852" rx="10" class="panel"/>
  <rect x="368" y="24" width="800" height="852" rx="10" class="panel"/>
  <rect x="1192" y="24" width="384" height="852" rx="10" class="panel"/>

  <rect x="24" y="24" width="320" height="64" class="header"/>
  <rect x="368" y="24" width="800" height="64" class="header"/>
  <rect x="1192" y="24" width="384" height="64" class="header"/>
  <text x="184" y="64" class="headerText">页面层</text>
  <text x="768" y="64" class="headerText">全局公共能力</text>
  <text x="1384" y="64" class="headerText">页面分流与公共组件</text>

  <!-- 两条横向链路背景 -->
  <rect x="42" y="112" width="284" height="300" rx="10" class="laneField"/>
  <rect x="386" y="112" width="764" height="300" rx="10" class="laneField"/>
  <rect x="1210" y="112" width="348" height="300" rx="10" class="laneField"/>

  <rect x="42" y="438" width="284" height="300" rx="10" class="laneModule"/>
  <rect x="386" y="438" width="764" height="300" rx="10" class="laneModule"/>
  <rect x="1210" y="438" width="348" height="300" rx="10" class="laneModule"/>

  <text x="60" y="140" class="laneLabelField">字段级链路</text>
  <text x="404" y="140" class="laneLabelField">字段识别</text>
  <text x="1228" y="140" class="laneLabelField">字段接入</text>
  <text x="60" y="466" class="laneLabelModule">模块级链路</text>
  <text x="404" y="466" class="laneLabelModule">模块权限查询</text>
  <text x="1228" y="466" class="laneLabelModule">模块接入</text>

  <!-- 字段级：页面输入 -->
  <rect x="70" y="190" width="228" height="116" rx="9" class="pageCard"/>
  <text x="184" y="226" class="titleText">页面取得字段值</text>
  <text x="184" y="258" class="bodyText">字段原始值</text>
  <text x="184" y="284" class="smallText">后端返回的业务字段</text>

  <!-- 字段级：公共识别 -->
  <rect x="420" y="186" width="252" height="124" rx="9" class="methodCard"/>
  <text x="546" y="220" class="titleText">识别是否受权限管控</text>
  <text x="546" y="252" class="codeText">isSensitiveMaskedValue</text>
  <text x="546" y="280" class="smallText">返回是否进入权限组件</text>

  <polygon points="768,196 824,248 768,300 712,248" class="diamondField"/>
  <text x="768" y="243" class="bodyText">受权限</text>
  <text x="768" y="261" class="bodyText">管控？</text>

  <!-- 字段级：页面分流与组件 -->
  <rect x="1234" y="154" width="300" height="64" rx="8" class="resultCard"/>
  <text x="1384" y="181" class="titleText">页面继续原业务处理</text>
  <text x="1384" y="203" class="smallText">未命中脱敏协议</text>

  <rect x="1234" y="226" width="300" height="166" rx="10" class="componentCard"/>
  <text x="1384" y="254" class="codeText">MaskedTooltip</text>
  <text x="1384" y="281" class="bodyText">内部解析字段权限状态</text>
  <text x="1384" y="304" class="tinyCode">parseSensitiveFieldState</text>
  <text x="1384" y="334" class="stateText">需要确认查看　·　缺少协作人　·　缺少数据权限</text>
  <line x1="1260" y1="350" x2="1508" y2="350" stroke="#c7d2e3" stroke-width="1"/>
  <text x="1384" y="375" class="bodyText">根据状态展示权限内容和操作入口</text>

  <!-- 字段级箭头 -->
  <path d="M298 248 H420" class="line"/>
  <path d="M672 248 H712" class="line"/>
  <path d="M824 248 H1088 V186 H1234" class="subline"/>
  <text x="858" y="235" class="branchText">否</text>
  <path d="M768 300 V326 H1110 V309 H1234" class="subline"/>
  <text x="798" y="320" class="branchText">是</text>

  <!-- 模块级：页面输入 -->
  <rect x="70" y="510" width="228" height="140" rx="9" class="pageCard"/>
  <text x="184" y="542" class="titleText">页面提供模块参数</text>
  <text x="184" y="574" class="bodyText">fieldKey</text>
  <text x="184" y="595" class="smallText">数据权限标识</text>
  <text x="184" y="622" class="bodyText">authorId</text>
  <text x="184" y="643" class="smallText">当前作者 ID</text>

  <!-- 模块级：公共查询与状态 -->
  <rect x="410" y="510" width="248" height="140" rx="9" class="methodCard"/>
  <text x="534" y="542" class="titleText">查询当前作者的模块权限</text>
  <text x="534" y="578" class="tinyCode"><tspan x="534">requestSensitiveModule</tspan><tspan x="534" dy="16">Permission</tspan></text>
  <text x="534" y="626" class="smallText">使用 fieldKey 和 authorId 查询</text>

  <rect x="702" y="510" width="246" height="140" rx="9" class="methodCard"/>
  <text x="825" y="542" class="titleText">转换为模块权限状态</text>
  <text x="825" y="578" class="tinyCode"><tspan x="825">getSensitiveModule</tspan><tspan x="825" dy="16">PermissionState</tspan></text>
  <text x="825" y="626" class="smallText">向页面返回统一模块状态</text>

  <polygon points="1054,528 1110,580 1054,632 998,580" class="diamondModule"/>
  <text x="1054" y="575" class="bodyText">模块可</text>
  <text x="1054" y="593" class="bodyText">查看？</text>

  <!-- 模块级：页面分流与组件 -->
  <rect x="1234" y="480" width="300" height="62" rx="8" class="resultCard"/>
  <text x="1384" y="506" class="titleText">页面加载原业务模块</text>
  <text x="1384" y="528" class="smallText">模块权限允许访问</text>

  <rect x="1234" y="552" width="300" height="166" rx="10" class="componentCard"/>
  <text x="1384" y="580" class="codeText">SensitiveNoPermission</text>
  <text x="1384" y="608" class="bodyText">接收模块状态和 fieldKey</text>
  <text x="1384" y="638" class="stateText">需要确认查看　·　缺少协作人　·　缺少数据权限</text>
  <line x1="1260" y1="654" x2="1508" y2="654" stroke="#c7d2e3" stroke-width="1"/>
  <text x="1384" y="681" class="bodyText">根据状态展示权限内容和操作入口</text>

  <!-- 模块级箭头 -->
  <path d="M298 580 H410" class="line"/>
  <path d="M658 580 H702" class="line"/>
  <path d="M948 580 H998" class="line"/>
  <path d="M1110 580 H1154 V511 H1234" class="subline"/>
  <text x="1132" y="566" class="branchText">是</text>
  <path d="M1054 632 V658 H1168 V635 H1234" class="subline"/>
  <text x="1084" y="652" class="branchText">否</text>

  <!-- 公共组件统一权限入口 -->
  <rect x="1210" y="762" width="348" height="94" rx="10" class="entryCard"/>
  <text x="1384" y="792" class="titleText">公共组件统一提供权限入口</text>
  <text x="1384" y="826" class="bodyText">申请协作人　｜　申请数据权限　｜　确认查看</text>

  <path d="M1534 309 H1546 V746 H1518 V762" class="subline"/>
  <path d="M1384 718 V762" class="subline"/>
</svg>
