<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1720" viewBox="0 0 1400 1720" role="img" aria-labelledby="title desc">
  <title id="title">头达数据权限前后端交互泳道图</title>
  <desc id="desc">五列泳道分别为运营人员、前端页面、后端处理、TCC 和权限平台。流程从页面请求开始，经过后端配置与权限判断，最后进入直接展示、数据权限申请、协作人申请或确认查看四种链路。</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#586273"/>
    </marker>
    <style>
      .lane-bg { stroke: #9aa1ab; stroke-width: 1.2; }
      .lane-head { fill: #eef0f3; stroke: #7f8792; stroke-width: 1.2; }
      .head-text { font: 500 20px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #273142; text-anchor: middle; }
      .node { stroke-width: 1.4; rx: 8; ry: 8; }
      .user-node { fill: #f3eff9; stroke: #75648d; }
      .frontend-node { fill: #edf4fb; stroke: #5d7d9f; }
      .backend-node { fill: #f3f4f6; stroke: #687386; }
      .tcc-node { fill: #eaf4ee; stroke: #60816b; }
      .platform-node { fill: #fff3e8; stroke: #a8733e; }
      .decision-node { fill: #fff6d8; stroke: #9a7b27; stroke-width: 1.4; }
      .node-text { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #29313d; text-anchor: middle; }
      .small-text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; text-anchor: middle; }
      .arrow { fill: none; stroke: #586273; stroke-width: 1.7; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #7a8492; stroke-width: 1.5; }
      .phase-label { font: 500 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #596273; }
    </style>
  </defs>

  <rect x="20" y="20" width="220" height="1670" fill="#fcfbfd" class="lane-bg"/>
  <rect x="240" y="20" width="310" height="1670" fill="#fafcff" class="lane-bg"/>
  <rect x="550" y="20" width="390" height="1670" fill="#fcfcfd" class="lane-bg"/>
  <rect x="940" y="20" width="200" height="1670" fill="#f9fcfa" class="lane-bg"/>
  <rect x="1140" y="20" width="240" height="1670" fill="#fffcf9" class="lane-bg"/>

  <rect x="20" y="20" width="220" height="68" class="lane-head"/>
  <rect x="240" y="20" width="310" height="68" class="lane-head"/>
  <rect x="550" y="20" width="390" height="68" class="lane-head"/>
  <rect x="940" y="20" width="200" height="68" class="lane-head"/>
  <rect x="1140" y="20" width="240" height="68" class="lane-head"/>

  <text x="130" y="61" class="head-text">运营人员</text>
  <text x="395" y="61" class="head-text">前端页面</text>
  <text x="745" y="61" class="head-text">后端处理</text>
  <text x="1040" y="61" class="head-text">TCC</text>
  <text x="1260" y="61" class="head-text">权限平台</text>

  <text x="36" y="112" class="phase-label">数据请求与权限判断</text>

  <rect x="45" y="130" width="170" height="58" class="node user-node"/>
  <text x="130" y="164" class="node-text">打开头达数据页面</text>

  <rect x="285" y="125" width="220" height="68" class="node frontend-node"/>
  <text x="395" y="153" class="node-text">
    <tspan x="395">发起业务数据或</tspan>
    <tspan x="395" dy="23">模块权限请求</tspan>
  </text>

  <rect x="620" y="125" width="250" height="68" class="node backend-node"/>
  <text x="745" y="153" class="node-text">
    <tspan x="745">接收前端请求</tspan>
    <tspan x="745" dy="23">进入后端处理</tspan>
  </text>

  <path d="M215 159 H285" class="arrow"/>
  <path d="M505 159 H620" class="arrow"/>

  <rect x="620" y="235" width="250" height="70" class="node backend-node"/>
  <text x="745" y="263" class="node-text">
    <tspan x="745">识别字段数据请求</tspan>
    <tspan x="745" dy="23">或模块权限请求</tspan>
  </text>
  <path d="M745 193 V235" class="arrow"/>

  <rect x="620" y="345" width="250" height="62" class="node backend-node"/>
  <text x="745" y="382" class="node-text">查询对应权限配置</text>
  <path d="M745 305 V345" class="arrow"/>

  <rect x="970" y="340" width="140" height="72" class="node tcc-node"/>
  <text x="1040" y="366" class="small-text">
    <tspan x="1040">返回字段与模块</tspan>
    <tspan x="1040" dy="21">权限配置</tspan>
  </text>
  <path d="M870 376 H970" class="arrow"/>

  <rect x="620" y="455" width="250" height="78" class="node backend-node"/>
  <text x="745" y="482" class="node-text">
    <tspan x="745">查询数据权限、协作关系</tspan>
    <tspan x="745" dy="23">和查看确认状态</tspan>
  </text>
  <path d="M1040 412 V432 H745 V455" class="arrow"/>

  <rect x="1170" y="455" width="180" height="78" class="node platform-node"/>
  <text x="1260" y="483" class="node-text">
    <tspan x="1260">返回权限、协作关系</tspan>
    <tspan x="1260" dy="23">和查看确认结果</tspan>
  </text>
  <path d="M870 494 H1170" class="arrow"/>

  <rect x="620" y="575" width="250" height="70" class="node backend-node"/>
  <text x="745" y="603" class="node-text">
    <tspan x="745">完成权限判断</tspan>
    <tspan x="745" dy="23">和字段转换</tspan>
  </text>
  <path d="M1260 533 V553 H745 V575" class="arrow"/>

  <rect x="620" y="690" width="250" height="82" class="node backend-node"/>
  <text x="745" y="716" class="small-text">
    <tspan x="745">字段：正常值或脱敏值</tspan>
    <tspan x="745" dy="22">模块：权限状态</tspan>
  </text>
  <path d="M745 645 V690" class="arrow"/>

  <rect x="285" y="690" width="220" height="82" class="node frontend-node"/>
  <text x="395" y="718" class="node-text">
    <tspan x="395">接收后端结果</tspan>
    <tspan x="395" dy="23">统一为四种页面状态</tspan>
  </text>
  <path d="M620 731 H505" class="arrow"/>

  <path d="M395 815 L495 865 L395 915 L295 865 Z" class="decision-node"/>
  <text x="395" y="858" class="node-text">
    <tspan x="395">当前</tspan>
    <tspan x="395" dy="22">页面状态</tspan>
  </text>
  <path d="M395 772 V815" class="arrow"/>

  <text x="36" y="947" class="phase-label">页面展示与权限操作</text>

  <path d="M495 865 H535 V1475" class="branch"/>

  <rect x="285" y="960" width="220" height="64" class="node frontend-node"/>
  <text x="395" y="987" class="node-text">
    <tspan x="395">① 可以查看</tspan>
    <tspan x="395" dy="22">直接展示数据</tspan>
  </text>
  <path d="M535 992 H505" class="arrow"/>

  <rect x="45" y="962" width="170" height="60" class="node user-node"/>
  <text x="130" y="998" class="node-text">查看真实数据</text>
  <path d="M285 992 H215" class="arrow"/>

  <rect x="275" y="1060" width="240" height="72" class="node frontend-node"/>
  <text x="395" y="1087" class="node-text">
    <tspan x="395">② 没有数据权限</tspan>
    <tspan x="395" dy="23">显示 **** 和申请入口</tspan>
  </text>
  <path d="M535 1096 H515" class="arrow"/>

  <rect x="45" y="1066" width="170" height="60" class="node user-node"/>
  <text x="130" y="1092" class="small-text">
    <tspan x="130">点击申请</tspan>
    <tspan x="130" dy="21">数据权限</tspan>
  </text>
  <path d="M275 1096 H215" class="arrow"/>

  <rect x="300" y="1160" width="190" height="56" class="node frontend-node"/>
  <text x="395" y="1194" class="node-text">提交数据权限申请</text>
  <rect x="630" y="1160" width="230" height="56" class="node backend-node"/>
  <text x="745" y="1194" class="node-text">发起数据权限申请</text>
  <rect x="1170" y="1155" width="180" height="66" class="node platform-node"/>
  <text x="1260" y="1194" class="node-text">处理权限申请</text>
  <path d="M130 1126 V1188 H300" class="arrow"/>
  <path d="M490 1188 H630" class="arrow"/>
  <path d="M860 1188 H1170" class="arrow"/>

  <rect x="275" y="1260" width="240" height="72" class="node frontend-node"/>
  <text x="395" y="1287" class="node-text">
    <tspan x="395">③ 没有协作关系</tspan>
    <tspan x="395" dy="23">显示 **** 和协作人入口</tspan>
  </text>
  <path d="M535 1296 H515" class="arrow"/>

  <rect x="45" y="1266" width="170" height="60" class="node user-node"/>
  <text x="130" y="1292" class="small-text">
    <tspan x="130">点击申请</tspan>
    <tspan x="130" dy="21">协作关系</tspan>
  </text>
  <path d="M275 1296 H215" class="arrow"/>

  <rect x="300" y="1360" width="190" height="56" class="node frontend-node"/>
  <text x="395" y="1394" class="node-text">提交协作人申请</text>
  <rect x="630" y="1360" width="230" height="56" class="node backend-node"/>
  <text x="745" y="1394" class="node-text">发起协作人申请</text>
  <rect x="1170" y="1355" width="180" height="66" class="node platform-node"/>
  <text x="1260" y="1394" class="node-text">处理协作人申请</text>
  <path d="M130 1326 V1388 H300" class="arrow"/>
  <path d="M490 1388 H630" class="arrow"/>
  <path d="M860 1388 H1170" class="arrow"/>

  <rect x="275" y="1460" width="240" height="72" class="node frontend-node"/>
  <text x="395" y="1487" class="node-text">
    <tspan x="395">④ 需要确认查看</tspan>
    <tspan x="395" dy="23">显示 **** 和小眼睛</tspan>
  </text>
  <path d="M535 1496 H515" class="arrow"/>

  <rect x="45" y="1466" width="170" height="60" class="node user-node"/>
  <text x="130" y="1492" class="small-text">
    <tspan x="130">点击小眼睛</tspan>
    <tspan x="130" dy="21">确认查看</tspan>
  </text>
  <path d="M275 1496 H215" class="arrow"/>

  <rect x="300" y="1560" width="190" height="56" class="node frontend-node"/>
  <text x="395" y="1594" class="node-text">提交查看确认</text>
  <rect x="620" y="1550" width="250" height="76" class="node backend-node"/>
  <text x="745" y="1578" class="node-text">
    <tspan x="745">保存查看记录</tspan>
    <tspan x="745" dy="23">并重新查询数据</tspan>
  </text>
  <path d="M130 1526 V1588 H300" class="arrow"/>
  <path d="M490 1588 H620" class="arrow"/>

  <rect x="285" y="1640" width="220" height="56" class="node frontend-node"/>
  <text x="395" y="1674" class="node-text">刷新并展示真实数据</text>
  <rect x="45" y="1640" width="170" height="56" class="node user-node"/>
  <text x="130" y="1674" class="node-text">查看真实数据</text>
  <path d="M745 1626 V1668 H505" class="arrow"/>
  <path d="M285 1668 H215" class="arrow"/>
</svg>
