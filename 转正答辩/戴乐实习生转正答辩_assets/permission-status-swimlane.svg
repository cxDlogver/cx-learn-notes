<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">权限状态获取泳道图</title>
  <desc id="desc">字段权限复用业务接口返回真实值或脱敏值，模块权限先调用独立权限接口，有权限后再请求业务数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#596273"/>
    </marker>
    <style>
      .lane { stroke:#9aa1ab; stroke-width:1.2; }
      .head { fill:#eef0f3; stroke:#7f8792; stroke-width:1.2; }
      .head-text { font:600 21px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#273142; text-anchor:middle; }
      .band-title { font:600 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#303846; }
      .node { stroke-width:1.4; rx:9; ry:9; }
      .frontend { fill:#eaf2ff; stroke:#4c78c2; }
      .backend { fill:#f2f4f7; stroke:#657183; }
      .tcc { fill:#eaf6ef; stroke:#3f8a5e; }
      .platform { fill:#fff3e8; stroke:#c47a2c; }
      .result { fill:#f3eeff; stroke:#7a5af8; }
      .text { font:400 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#29313d; text-anchor:middle; }
      .small { font:400 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif; fill:#414b59; text-anchor:middle; }
      .arrow { fill:none; stroke:#596273; stroke-width:1.7; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="20" width="280" height="900" fill="#fbfdff" class="lane"/>
  <rect x="300" y="20" width="500" height="900" fill="#fcfcfd" class="lane"/>
  <rect x="800" y="20" width="240" height="900" fill="#fbfefc" class="lane"/>
  <rect x="1040" y="20" width="340" height="900" fill="#fffcf9" class="lane"/>

  <rect x="20" y="20" width="280" height="68" class="head"/>
  <rect x="300" y="20" width="500" height="68" class="head"/>
  <rect x="800" y="20" width="240" height="68" class="head"/>
  <rect x="1040" y="20" width="340" height="68" class="head"/>
  <text x="160" y="62" class="head-text">前端页面</text>
  <text x="550" y="62" class="head-text">后端处理</text>
  <text x="920" y="62" class="head-text">TCC</text>
  <text x="1210" y="62" class="head-text">权限平台</text>

  <rect x="32" y="105" width="1336" height="365" rx="12" fill="#f5f8ff" stroke="#c5d5f2"/>
  <text x="52" y="134" class="band-title">字段权限：复用原业务接口</text>

  <rect x="55" y="160" width="210" height="62" class="node frontend"/>
  <text x="160" y="197" class="text">请求业务数据</text>
  <rect x="355" y="150" width="230" height="82" class="node backend"/>
  <text x="470" y="181" class="text"><tspan x="470">识别受控字段</tspan><tspan x="470" dy="23">读取字段配置</tspan></text>
  <rect x="835" y="155" width="170" height="72" class="node tcc"/>
  <text x="920" y="183" class="small"><tspan x="920">返回 front_key</tspan><tspan x="920" dy="21">及权限配置</tspan></text>
  <rect x="355" y="270" width="230" height="82" class="node backend"/>
  <text x="470" y="301" class="text"><tspan x="470">判断数据权限、协作关系</tspan><tspan x="470" dy="23">和七天查看状态</tspan></text>
  <rect x="1080" y="270" width="260" height="82" class="node platform"/>
  <text x="1210" y="301" class="text"><tspan x="1210">返回权限、协作关系</tspan><tspan x="1210" dy="23">和查看状态</tspan></text>
  <rect x="355" y="385" width="300" height="64" class="node backend"/>
  <text x="505" y="411" class="small"><tspan x="505">返回真实值，或返回携带状态的脱敏值</tspan><tspan x="505" dy="21">front_key / 888 / 999</tspan></text>
  <rect x="55" y="385" width="210" height="64" class="node result"/>
  <text x="160" y="411" class="small"><tspan x="160">根据返回值识别状态</tspan><tspan x="160" dy="21">不在前端恢复真实数据</tspan></text>

  <path d="M265 191 H355" class="arrow"/>
  <path d="M585 191 H835" class="arrow"/>
  <path d="M835 210 H700 V255 H470 V270" class="arrow"/>
  <path d="M585 311 H1080" class="arrow"/>
  <path d="M1080 334 H720 V370 H505 V385" class="arrow"/>
  <path d="M355 417 H265" class="arrow"/>

  <rect x="32" y="490" width="1336" height="410" rx="12" fill="#fffaf0" stroke="#ead49b"/>
  <text x="52" y="519" class="band-title">模块权限：先查模块权限，再决定是否请求业务数据</text>

  <rect x="50" y="545" width="220" height="74" class="node frontend"/>
  <text x="160" y="573" class="small"><tspan x="160">调用模块权限能力</tspan><tspan x="160" dy="21">front_key + author_id</tspan></text>
  <rect x="355" y="545" width="230" height="74" class="node backend"/>
  <text x="470" y="573" class="text"><tspan x="470">接收模块权限查询</tspan><tspan x="470" dy="23">定位权限对象</tspan></text>
  <rect x="835" y="545" width="170" height="74" class="node tcc"/>
  <text x="920" y="573" class="small"><tspan x="920">front_key 映射</tspan><tspan x="920" dy="21">permission_code</tspan></text>
  <rect x="355" y="655" width="230" height="74" class="node backend"/>
  <text x="470" y="683" class="text"><tspan x="470">查询模块权限</tspan><tspan x="470" dy="23">和查看状态</tspan></text>
  <rect x="1080" y="650" width="260" height="84" class="node platform"/>
  <text x="1210" y="680" class="small"><tspan x="1210">返回 has_permission</tspan><tspan x="1210" dy="21">is_coo / need_eyes</tspan></text>
  <rect x="355" y="775" width="300" height="72" class="node backend"/>
  <text x="505" y="804" class="small"><tspan x="505">返回模块权限状态</tspan><tspan x="505" dy="21">不在该接口返回真实业务数据</tspan></text>
  <rect x="45" y="765" width="230" height="92" class="node result"/>
  <text x="160" y="793" class="small"><tspan x="160">有权限：再请求业务数据</tspan><tspan x="160" dy="21">无权限：展示对应入口</tspan><tspan x="160" dy="21">需要确认：展示小眼睛</tspan></text>

  <path d="M270 582 H355" class="arrow"/>
  <path d="M585 582 H835" class="arrow"/>
  <path d="M835 604 H700 V640 H470 V655" class="arrow"/>
  <path d="M585 692 H1080" class="arrow"/>
  <path d="M1080 716 H720 V760 H505 V775" class="arrow"/>
  <path d="M355 811 H275" class="arrow"/>
</svg>
