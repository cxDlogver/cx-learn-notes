name: plan-checkin-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plan_checkin
      POSTGRES_USER: plan_checkin
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - 127.0.0.1:${PLAN_CHECKIN_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U plan_checkin -d plan_checkin"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${PLAN_CHECKIN_REDIS_PORT:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  object-storage:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: local_only_change_me
      S3_BUCKET: plan-checkin-local
    ports:
      - 127.0.0.1:${PLAN_CHECKIN_OBJECT_PORT:-9000}:8333
    volumes:
      - object_data:/data
volumes:
  postgres_data:
  object_data:
