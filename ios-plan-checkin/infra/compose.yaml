name: plan-checkin-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plan_checkin
      POSTGRES_USER: plan_checkin
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U plan_checkin -d plan_checkin"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: local_only_change_me
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - object_data:/data
volumes:
  postgres_data:
  object_data:
