<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">一次 Agent Stage 的真实调用链</title>
  <desc id="desc">接口只定义契约；执行器通过注册表找到具体 Adapter，具体 Adapter 才调用 Agent 产品</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1600" height="1030" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">一次 Agent Stage 的真实调用链</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">接口只定义契约；执行器通过注册表找到具体 Adapter，具体 Adapter 才调用 Agent 产品</text>

    <rect x="55" y="195" width="300" height="350" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <rect x="85" y="222" width="170" height="40" rx="20" fill="#C05A12" stroke="#C05A12" stroke-width="0"/>
<text x="170" y="249" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Business Workflow</text>
    <text x="85" y="300" font-size="26" font-weight="500" fill="#172033" text-anchor="start">当前 Agent Stage</text>
    <text x="85" y="350" font-size="19" font-weight="400" fill="#172033" text-anchor="start">StageSpec</text>
<text x="85" y="392" font-size="19" font-weight="400" fill="#172033" text-anchor="start">任务目标与输入</text>
<text x="85" y="434" font-size="19" font-weight="400" fill="#172033" text-anchor="start">指定 provider</text>
<text x="85" y="476" font-size="19" font-weight="400" fill="#172033" text-anchor="start">Skill / Tool / MCP</text>
<text x="85" y="518" font-size="19" font-weight="400" fill="#172033" text-anchor="start">工作区、权限、超时</text>

    <path d="M 355 360 L 425 360" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="425" y="195" width="355" height="170" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="222" width="280" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="600" y="249" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">AgentStageExecutor</text>
    <text x="602" y="300" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">Workflow 的唯一调用入口</text>
    <text x="602" y="334" font-size="18" font-weight="400" fill="#5F6B7A" text-anchor="middle">run(stage, signal)</text>

    <path d="M 602 365 L 602 420" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="425" y="420" width="355" height="230" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="602" y="464" font-size="23" font-weight="500" fill="#2563EB" text-anchor="middle">Adapter 注册表</text>
    <rect x="458" y="492" width="289" height="42" rx="8" fill="#EAF2FF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="602" y="519" font-size="16" font-weight="500" fill="#172033" text-anchor="middle">codex → CodexStageAdapter</text>
    <rect x="458" y="544" width="289" height="42" rx="8" fill="#EAF2FF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="602" y="571" font-size="15" font-weight="500" fill="#172033" text-anchor="middle">claude-code → ClaudeCodeStageAdapter</text>
    <rect x="458" y="596" width="289" height="42" rx="8" fill="#EAF2FF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="602" y="623" font-size="15" font-weight="500" fill="#172033" text-anchor="middle">trae-agent → TraeAgentStageAdapter</text>

    <rect x="425" y="685" width="355" height="120" rx="18" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="602" y="726" font-size="22" font-weight="500" fill="#15803D" text-anchor="middle">StageAgentAdapter</text>
    <text x="602" y="761" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">接口契约：规定 run 的输入和返回</text>
    <text x="602" y="788" font-size="17" font-weight="500" fill="#15803D" text-anchor="middle">它本身不调用任何 Agent</text>

    <text x="845" y="173" font-size="20" font-weight="500" fill="#5F6B7A" text-anchor="start">具体 Adapter：实现接口、执行调用、转换结果</text>
    <path d="M 780 505 L 845 280" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 780 525 L 845 500" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 780 545 L 845 720" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="845" y="195" width="315" height="170" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1002" y="238" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">CodexStageAdapter</text>
    <text x="1002" y="276" font-size="16" font-weight="400" fill="#2563EB" text-anchor="middle">implements StageAgentAdapter</text>
    <text x="1002" y="314" font-size="17" font-weight="500" fill="#172033" text-anchor="middle">调用 SDK → 转成 StageResult</text>
    <path d="M 1160 280 L 1225 280" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1225" y="215" width="310" height="130" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1380" y="264" font-size="23" font-weight="500" fill="#172033" text-anchor="middle">Codex SDK</text>
    <text x="1380" y="303" font-size="17" font-weight="400" fill="#5F6B7A" text-anchor="middle">thread.run(stagePrompt)</text>

    <rect x="845" y="415" width="315" height="170" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1002" y="458" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">ClaudeCodeStageAdapter</text>
    <text x="1002" y="496" font-size="16" font-weight="400" fill="#2563EB" text-anchor="middle">implements StageAgentAdapter</text>
    <text x="1002" y="534" font-size="17" font-weight="500" fill="#172033" text-anchor="middle">启动 CLI → 转成 StageResult</text>
    <path d="M 1160 500 L 1225 500" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1225" y="435" width="310" height="130" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1380" y="484" font-size="23" font-weight="500" fill="#172033" text-anchor="middle">Claude Code CLI</text>
    <text x="1380" y="523" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">claude -p ... --output-format json</text>

    <rect x="845" y="635" width="315" height="170" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1002" y="678" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">TraeAgentStageAdapter</text>
    <text x="1002" y="716" font-size="16" font-weight="400" fill="#2563EB" text-anchor="middle">implements StageAgentAdapter</text>
    <text x="1002" y="754" font-size="17" font-weight="500" fill="#172033" text-anchor="middle">启动 CLI → 转成 StageResult</text>
    <path d="M 1160 720 L 1225 720" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1225" y="655" width="310" height="130" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1380" y="704" font-size="23" font-weight="500" fill="#172033" text-anchor="middle">Trae Agent CLI</text>
    <text x="1380" y="743" font-size="17" font-weight="400" fill="#5F6B7A" text-anchor="middle">trae-cli run ...</text>

    <text x="1002" y="838" font-size="17" font-weight="500" fill="#15803D" text-anchor="middle">任一具体 Adapter 的 run 都统一返回</text>
    <path d="M 1002 848 L 1002 875" fill="none" stroke="#15803D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="790" y="875" width="425" height="110" rx="18" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="1002" y="919" font-size="23" font-weight="500" fill="#15803D" text-anchor="middle">统一 StageResult</text>
    <text x="1002" y="955" font-size="18" font-weight="400" fill="#172033" text-anchor="middle">状态、产物、证据、统一错误</text>

    <path d="M 1215 930 L 1270 930" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1270" y="875" width="130" height="110" rx="18" fill="#FFF0F0" stroke="#B93838" stroke-width="2"/>
    <text x="1335" y="919" font-size="23" font-weight="500" fill="#B93838" text-anchor="middle">Gate</text>
    <text x="1335" y="955" font-size="17" font-weight="400" fill="#172033" text-anchor="middle">检查结果</text>
    <path d="M 1400 930 L 1440 930" fill="none" stroke="#B93838" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1440" y="875" width="115" height="110" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <text x="1497" y="919" font-size="21" font-weight="500" fill="#C05A12" text-anchor="middle">编排器</text>
    <text x="1497" y="955" font-size="15" font-weight="400" fill="#172033" text-anchor="middle">映射下一阶段</text>

  </g>
</svg>
