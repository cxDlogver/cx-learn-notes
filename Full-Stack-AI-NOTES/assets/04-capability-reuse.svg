<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="850" viewBox="0 0 1460 850" role="img" aria-labelledby="title desc">
  <title id="title">Capability 的核心是复用</title>
  <desc id="desc">实现方式不是分层依据，稳定的能力契约才是</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1460" height="850" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">Capability 的核心是复用</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">实现方式不是分层依据，稳定的能力契约才是</text>

    <rect x="505" y="170" width="450" height="450" rx="18" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <rect x="625" y="198" width="210" height="40" rx="20" fill="#15803D" stroke="#15803D" stroke-width="0"/>
<text x="730" y="225" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Capability</text>
    <text x="730" y="286" font-size="27" font-weight="500" fill="#172033" text-anchor="middle">稳定、受控、可评测</text>
    <rect x="555" y="325" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="635" y="369" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">Skill</text>
    <rect x="745" y="325" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="825" y="369" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">Tool</text>
    <rect x="555" y="420" width="350" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="730" y="464" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">数据 · 知识 · 检索</text>
    <rect x="555" y="515" width="350" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="730" y="559" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">可选：共享长期记忆</text>

    <rect x="80" y="225" width="290" height="120" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="225" y="274" font-size="24" font-weight="500" fill="#172033" text-anchor="middle">缺陷诊断 Agent</text>
    <text x="225" y="310" font-size="19" font-weight="400" fill="#5F6B7A" text-anchor="middle">代码 · 日志 · CRI 查询</text>
    <rect x="80" y="455" width="290" height="120" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="225" y="504" font-size="24" font-weight="500" fill="#172033" text-anchor="middle">风险审查 Agent</text>
    <text x="225" y="540" font-size="19" font-weight="400" fill="#5F6B7A" text-anchor="middle">规则 · 补丁 · 测试证据</text>

    <rect x="1090" y="225" width="290" height="120" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1235" y="274" font-size="24" font-weight="500" fill="#172033" text-anchor="middle">另一个业务流程</text>
    <text x="1235" y="310" font-size="19" font-weight="400" fill="#5F6B7A" text-anchor="middle">复用同一能力契约</text>
    <rect x="1090" y="455" width="290" height="120" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1235" y="504" font-size="24" font-weight="500" fill="#172033" text-anchor="middle">不同 Agent 客户端</text>
    <text x="1235" y="540" font-size="19" font-weight="400" fill="#5F6B7A" text-anchor="middle">API、CLI 或 MCP 接入</text>

    <path d="M 370 285 L 505 335" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 370 515 L 505 455" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 1090 285 L 955 335" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 1090 515 L 955 455" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="260" y="700" width="940" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="730" y="739" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">进入 Capability 的门槛：有真实复用方 + 稳定契约 + 负责人 + 版本 + 权限 + 评测</text>
    <text x="730" y="773" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="middle">只有一个调用方的内部实现，先留在 Application</text>

  </g>
</svg>
