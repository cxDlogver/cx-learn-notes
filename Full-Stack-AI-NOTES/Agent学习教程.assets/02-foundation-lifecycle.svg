<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="850" viewBox="0 0 1460 850" role="img" aria-labelledby="title desc">
  <title id="title">Foundation 按生命周期梳理</title>
  <desc id="desc">构建、执行和运营覆盖 Foundation 的完整职责</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1460" height="850" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">Foundation 按生命周期梳理</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">构建、执行和运营覆盖 Foundation 的完整职责</text>

    <path d="M 445 310 L 560 310" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 900 310 L 1015 310" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="85" y="175" width="360" height="280" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="135" cy="220" r="25" fill="#2563EB"/>
<text x="135" y="228" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="175" y="229" font-size="28" font-weight="500" fill="#172033" text-anchor="start">构建 Agent</text>
    <text x="125" y="285" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">模型访问与 Agent loop</text>
<text x="125" y="326" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">上下文与工具调用</text>
<text x="125" y="367" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">工作区、沙箱与审批</text>
<text x="125" y="408" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">产物和结构化输出</text>

    <rect x="560" y="175" width="340" height="280" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="610" cy="220" r="25" fill="#2563EB"/>
<text x="610" y="228" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="650" y="229" font-size="28" font-weight="500" fill="#172033" text-anchor="start">执行一次 Run</text>
    <text x="600" y="285" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">Identity 与状态</text>
<text x="600" y="326" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">Checkpoint 与调度</text>
<text x="600" y="367" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">超时、取消、重试</text>
<text x="600" y="408" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">隔离、产物与事件</text>

    <rect x="1015" y="175" width="360" height="280" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="1065" cy="220" r="25" fill="#2563EB"/>
<text x="1065" y="228" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1105" y="229" font-size="28" font-weight="500" fill="#172033" text-anchor="start">运营多个 Agent</text>
    <text x="1055" y="285" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">注册、版本与发布</text>
<text x="1055" y="326" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">身份、密钥与网络</text>
<text x="1055" y="367" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">观测、评测与预算</text>
<text x="1055" y="408" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="start">审计、灰度与回滚</text>

    <text x="85" y="535" font-size="24" font-weight="500" fill="#172033" text-anchor="start">贯穿生命周期的基础能力</text>
    <rect x="85" y="570" width="1290" height="72" rx="12" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="730" y="616" font-size="22" font-weight="500" fill="#172033" text-anchor="middle">身份与权限   ·   状态与产物   ·   观测与审计   ·   配置与版本</text>

    <text x="85" y="715" font-size="22" font-weight="500" fill="#172033" text-anchor="start">Foundation 中常见的工程称呼，职责范围会交叉</text>
    <rect x="85" y="750" width="250" height="40" rx="20" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/>
<text x="210" y="777" font-size="18" font-weight="500" fill="#2563EB" text-anchor="middle">Runtime：可靠执行</text>
    <rect x="365" y="750" width="310" height="40" rx="20" fill="#EAF8EF" stroke="#EAF8EF" stroke-width="0"/>
<text x="520" y="777" font-size="18" font-weight="500" fill="#15803D" text-anchor="middle">Harness：Agent 工作外壳</text>
    <rect x="705" y="750" width="390" height="40" rx="20" fill="#FFF2E2" stroke="#FFF2E2" stroke-width="0"/>
<text x="900" y="777" font-size="18" font-weight="500" fill="#C05A12" text-anchor="middle">Platform：统一运营多个 Agent</text>
    <text x="1125" y="778" font-size="20" font-weight="500" fill="#5F6B7A" text-anchor="start">三者可重叠</text>

  </g>
</svg>
