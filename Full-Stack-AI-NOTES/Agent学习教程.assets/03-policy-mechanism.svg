<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="870" viewBox="0 0 1460 870" role="img" aria-labelledby="title desc">
  <title id="title">重试策略与执行机制如何分工</title>
  <desc id="desc">Application 定义策略，Runtime 执行并报告结果</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1460" height="870" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">重试策略与执行机制如何分工</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">Application 定义策略，Runtime 执行并报告结果</text>

    <rect x="90" y="170" width="530" height="500" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <rect x="125" y="200" width="190" height="40" rx="20" fill="#C05A12" stroke="#C05A12" stroke-width="0"/>
<text x="220" y="227" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Application</text>
    <text x="125" y="282" font-size="28" font-weight="500" fill="#172033" text-anchor="start">定义业务策略</text>
    <text x="125" y="330" font-size="22" font-weight="400" fill="#172033" text-anchor="start">哪些错误可以重试</text>
<text x="125" y="379" font-size="22" font-weight="400" fill="#172033" text-anchor="start">最多多少次、间隔多久</text>
<text x="125" y="428" font-size="22" font-weight="400" fill="#172033" text-anchor="start">继续会话还是新开执行</text>
<text x="125" y="477" font-size="22" font-weight="400" fill="#172033" text-anchor="start">耗尽后转人工还是错误分支</text>
<text x="125" y="526" font-size="22" font-weight="400" fill="#172033" text-anchor="start">质量失败回到哪个业务阶段</text>

    <rect x="840" y="170" width="530" height="500" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="875" y="200" width="176" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="963" y="227" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Foundation</text>
    <text x="875" y="282" font-size="28" font-weight="500" fill="#172033" text-anchor="start">提供执行机制</text>
    <text x="875" y="330" font-size="22" font-weight="400" fill="#172033" text-anchor="start">记录 attempt 与错误码</text>
<text x="875" y="379" font-size="22" font-weight="400" fill="#172033" text-anchor="start">设置计时器并调度重试</text>
<text x="875" y="428" font-size="22" font-weight="400" fill="#172033" text-anchor="start">读取 checkpoint 并恢复</text>
<text x="875" y="477" font-size="22" font-weight="400" fill="#172033" text-anchor="start">保证状态一致和调用幂等</text>
<text x="875" y="526" font-size="22" font-weight="400" fill="#172033" text-anchor="start">发出成功、失败或耗尽事件</text>

    <path d="M 620 320 L 840 320" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="730" y="292" font-size="20" font-weight="500" fill="#C05A12" text-anchor="middle">策略参数</text>
    <path d="M 840 530 L 620 530" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="730" y="574" font-size="20" font-weight="500" fill="#2563EB" text-anchor="middle">执行事件</text>

    <rect x="250" y="720" width="960" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="730" y="758" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">例：第三次超时后，Foundation 发出 STAGE_RETRY_EXHAUSTED</text>
    <text x="730" y="790" font-size="21" font-weight="400" fill="#5F6B7A" text-anchor="middle">Application 再把 BUG-42 转入人工排查</text>

  </g>
</svg>
