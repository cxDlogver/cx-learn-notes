<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" role="img" aria-labelledby="title desc">
  <title id="title">BUG-42：Application、Capability 与 Foundation 怎样配合</title>
  <desc id="desc">业务流程决定去向，能力层提供复用能力，Foundation 负责可靠执行</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1480" height="1010" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">BUG-42：Application、Capability 与 Foundation 怎样配合</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">业务流程决定去向，能力层提供复用能力，Foundation 负责可靠执行</text>

    <rect x="65" y="165" width="170" height="40" rx="20" fill="#C05A12" stroke="#C05A12" stroke-width="0"/>
<text x="150" y="192" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Application</text>
    <text x="255" y="193" font-size="23" font-weight="500" fill="#C05A12" text-anchor="start">Business Workflow：Stage、分支、回流和人工责任</text>
    <rect x="60" y="220" width="1360" height="245" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>

    <rect x="85" y="285" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="160" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">收集上下文</text>
    <text x="160" y="351" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">普通代码</text>
    <path d="M 235 330 L 265 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="265" y="285" width="150" height="90" rx="10" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="340" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">定位根因</text>
    <text x="340" y="351" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">Agent + Skill A</text>
    <path d="M 415 330 L 445 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="445" y="285" width="150" height="90" rx="10" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="520" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">修改代码</text>
    <text x="520" y="351" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">同一 Agent + Skill B</text>
    <path d="M 595 330 L 625 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="625" y="285" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#B93838" stroke-width="2"/>
    <text x="700" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">独立测试</text>
    <text x="700" y="351" font-size="16" font-weight="400" fill="#B93838" text-anchor="middle">Test Gate</text>
    <path d="M 775 330 L 805 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="805" y="285" width="150" height="90" rx="10" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="880" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">风险审查</text>
    <text x="880" y="351" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">独立只读 Agent</text>
    <path d="M 955 330 L 985 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="985" y="285" width="150" height="90" rx="10" fill="#FFF0F0" stroke="#B93838" stroke-width="2"/>
    <text x="1060" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">人工审批</text>
    <text x="1060" y="351" font-size="16" font-weight="400" fill="#B93838" text-anchor="middle">Human Gate</text>
    <path d="M 1135 330 L 1165 330" fill="none" stroke="#C05A12" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1165" y="285" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1240" y="322" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">发布</text>
    <text x="1240" y="351" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">Release Tool</text>

    <path d="M 700 375 L 700 425 L 520 425 L 520 375" fill="none" stroke="#B93838" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="610" y="450" font-size="17" font-weight="500" fill="#B93838" text-anchor="middle">测试失败：repairRound + 1，回到修改</text>

    <rect x="65" y="515" width="160" height="40" rx="20" fill="#15803D" stroke="#15803D" stroke-width="0"/>
<text x="145" y="542" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Capability</text>
    <text x="245" y="543" font-size="23" font-weight="500" fill="#15803D" text-anchor="start">各 Stage 读取本阶段需要的可复用能力</text>
    <rect x="60" y="570" width="1360" height="135" rx="18" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <rect x="100" y="608" width="245" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="223" y="646" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">根因分析 Skill</text>
    <rect x="380" y="608" width="245" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="503" y="646" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">安全改码 Skill</text>
    <rect x="660" y="608" width="245" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="783" y="646" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">代码 / 日志 / CRI Tool</text>
    <rect x="940" y="608" width="245" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1063" y="646" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">风险审查 Skill</text>
    <rect x="1220" y="618" width="150" height="40" rx="20" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="1295" y="645" font-size="18" font-weight="500" fill="#15803D" text-anchor="middle">MCP 可接入</text>

    <rect x="65" y="755" width="170" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="150" y="782" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Foundation</text>
    <text x="255" y="783" font-size="23" font-weight="500" fill="#2563EB" text-anchor="start">Runtime 执行每次 Run；Harness 提供 Agent 工作外壳</text>
    <rect x="60" y="810" width="1360" height="155" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="100" y="850" width="260" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="230" y="882" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Run identity 与状态</text>
    <text x="230" y="907" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">instance / stage / attempt</text>
    <rect x="395" y="850" width="260" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="525" y="882" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">隔离工作区与权限</text>
    <text x="525" y="907" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">read-only / workspace-write</text>
    <rect x="690" y="850" width="260" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="820" y="882" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Checkpoint 与产物</text>
    <text x="820" y="907" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">报告 / 补丁 / 测试证据</text>
    <rect x="985" y="850" width="355" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1163" y="882" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">超时、取消与技术重试</text>
    <text x="1163" y="907" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">PROVIDER_TIMEOUT → attempt + 1</text>

    <path d="M 340 375 L 340 500 L 1370 500 L 1370 887 L 1340 887" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="1125" y="490" font-size="17" font-weight="500" fill="#2563EB" text-anchor="middle">模型超时：Runtime 按策略重新调度当前 Stage</text>

  </g>
</svg>
