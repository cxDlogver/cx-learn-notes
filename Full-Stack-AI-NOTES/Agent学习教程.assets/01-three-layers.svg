<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="870" viewBox="0 0 1480 870" role="img" aria-labelledby="title desc">
  <title id="title">企业 Agent 三层架构</title>
  <desc id="desc">三层按责任和复用范围划分，不按产品名划分</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1480" height="870" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">企业 Agent 三层架构</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">三层按责任和复用范围划分，不按产品名划分</text>

    <rect x="120" y="170" width="1070" height="180" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <rect x="155" y="196" width="166" height="40" rx="20" fill="#C05A12" stroke="#C05A12" stroke-width="0"/>
<text x="238" y="223" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Application</text>
    <text x="350" y="230" font-size="26" font-weight="500" fill="#172033" text-anchor="start">把业务目标写成可交付、可审计的流程</text>
    <text x="350" y="274" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">Business Workflow 管住主干：Stage、Gate、分支、人工责任</text>
<text x="350" y="308" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">Agentic Workflow 处理开放任务：检索、分析、编码、综合判断</text>

    <rect x="120" y="390" width="1070" height="180" rx="18" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <rect x="155" y="416" width="166" height="40" rx="20" fill="#15803D" stroke="#15803D" stroke-width="0"/>
<text x="238" y="443" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Capability</text>
    <text x="350" y="450" font-size="26" font-weight="500" fill="#172033" text-anchor="start">沉淀多个 Agent 和流程都能调用的能力</text>
    <text x="350" y="494" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">Skill · Tool · CLI / API / Service · 数据与知识检索</text>
<text x="350" y="528" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">MCP 是复用接入方式；共享长期记忆按真实需求建设</text>

    <rect x="120" y="610" width="1070" height="180" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="155" y="636" width="166" height="40" rx="20" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="238" y="663" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Foundation</text>
    <text x="350" y="670" font-size="26" font-weight="500" fill="#172033" text-anchor="start">提供与具体业务无关的通用机制</text>
    <text x="350" y="714" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">构建 Agent · 可靠执行一次 Run · 运营多个 Agent</text>
<text x="350" y="748" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">状态、隔离、权限、恢复、观测、发布与治理</text>

    <path d="M 1240 700 L 1240 500" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 1240 480 L 1240 280" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1360" y="500" font-size="19" font-weight="500" fill="#5F6B7A" text-anchor="middle">提供机制与复用能力</text>
    <text x="1360" y="528" font-size="19" font-weight="400" fill="#5F6B7A" text-anchor="middle">由业务层组合</text>

  </g>
</svg>
