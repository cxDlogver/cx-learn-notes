<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560" role="img" aria-labelledby="title desc">
  <title id="title">两种 Workflow 的完整推进方式</title>
  <desc id="desc">Agentic Workflow 由模型结合反馈推进，Business Workflow 由流程定义和状态迁移推进</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="1600" height="1560" fill="#F8FAFC"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="76" font-size="36" font-weight="500" fill="#172033" text-anchor="start">两种 Workflow 的完整推进方式</text>
    <text x="72" y="116" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="start">Agentic Workflow 由模型结合反馈推进，Business Workflow 由流程定义和状态迁移推进</text>

    <rect x="60" y="160" width="1480" height="570" rx="18" fill="#F3ECFF" stroke="#6D3FC0" stroke-width="2"/>
    <rect x="95" y="185" width="170" height="40" rx="20" fill="#6D3FC0" stroke="#6D3FC0" stroke-width="0"/>
<text x="180" y="212" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">目标导向</text>
    <text x="300" y="214" font-size="27" font-weight="500" fill="#172033" text-anchor="start">Agentic Workflow：模型根据执行反馈决定下一步</text>

    <rect x="95" y="260" width="300" height="395" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="120" y="295" font-size="21" font-weight="500" fill="#172033" text-anchor="start">输入与上下文来源</text>
    <rect x="120" y="320" width="250" height="60" rx="10" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="245" y="357" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">目标 · 上下文 · 约束</text>
    <rect x="120" y="400" width="250" height="60" rx="10" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="245" y="437" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">系统指令 · 已加载 Skill</text>
    <rect x="120" y="480" width="250" height="60" rx="10" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="245" y="517" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Run state</text>
    <rect x="120" y="560" width="250" height="60" rx="10" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="245" y="587" font-size="17" font-weight="500" fill="#172033" text-anchor="middle">Tool · MCP · API · Agent</text>
    <text x="245" y="610" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">能力描述</text>
    <text x="245" y="642" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">Skill 提供方法与约束，不负责调用 Tool</text>

    <path d="M 395 355 L 455 355" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="455" y="305" width="230" height="100" rx="12" fill="#FFFFFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="570" y="345" font-size="20" font-weight="500" fill="#172033" text-anchor="middle">Context Assembly</text>
    <text x="570" y="376" font-size="17" font-weight="400" fill="#5F6B7A" text-anchor="middle">组装本轮模型上下文</text>
    <path d="M 685 355 L 755 355" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="755" y="305" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="865" y="345" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">模型判断下一步</text>
    <text x="865" y="376" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">Action 或 Final Candidate</text>

    <path d="M 975 345 L 1040 345" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1007" y="325" font-size="15" font-weight="500" fill="#6D3FC0" text-anchor="middle">Final</text>
    <rect x="1040" y="285" width="190" height="140" rx="12" fill="#FFFFFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="1135" y="330" font-size="21" font-weight="500" fill="#172033" text-anchor="middle">Exit Check</text>
    <text x="1135" y="362" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">完成条件</text>
<text x="1135" y="389" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">Schema · 预算 · 策略</text>
    <path d="M 1230 345 L 1275 345" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1275" y="250" width="225" height="235" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1388" y="283" font-size="19" font-weight="500" fill="#172033" text-anchor="middle">退出结果</text>
    <rect x="1295" y="300" width="185" height="38" rx="8" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="1388" y="325" font-size="16" font-weight="500" fill="#15803D" text-anchor="middle">Final Result</text>
    <rect x="1295" y="348" width="185" height="38" rx="8" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <text x="1388" y="373" font-size="16" font-weight="500" fill="#C05A12" text-anchor="middle">Human / Blocked</text>
    <rect x="1295" y="396" width="185" height="38" rx="8" fill="#FFF0F0" stroke="#B93838" stroke-width="2"/>
    <text x="1388" y="421" font-size="16" font-weight="500" fill="#B93838" text-anchor="middle">Failed / Cancelled</text>
    <rect x="1295" y="444" width="185" height="28" rx="8" fill="#F3ECFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="1388" y="464" font-size="14" font-weight="500" fill="#6D3FC0" text-anchor="middle">反馈后继续</text>

    <path d="M 865 405 L 865 500" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="895" y="462" font-size="15" font-weight="500" fill="#6D3FC0" text-anchor="start">Action</text>
    <rect x="755" y="500" width="220" height="80" rx="12" fill="#F3ECFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="865" y="534" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">产生结构化 Action</text>
    <text x="865" y="560" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">选择可调用对象与参数</text>
    <path d="M 975 540 L 1040 540" fill="none" stroke="#6D3FC0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1040" y="500" width="440" height="100" rx="12" fill="#EAF8EF" stroke="#15803D" stroke-width="2"/>
    <text x="1260" y="540" font-size="20" font-weight="500" fill="#172033" text-anchor="middle">执行 Tool · MCP · API · 其他 Agent</text>
    <text x="1260" y="572" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">Harness 执行动作并返回 Observation</text>

    <rect x="455" y="610" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="570" y="646" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">更新上下文与 Run state</text>
    <text x="570" y="675" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">保存结果、证据和错误</text>
    <path d="M 1260 600 L 1260 655 L 685 655" fill="none" stroke="#15803D" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 570 610 L 570 455 L 805 455 L 805 405" fill="none" stroke="#6D3FC0" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="685" y="445" font-size="15" font-weight="500" fill="#6D3FC0" text-anchor="middle">下一轮</text>
    <path d="M 1295 458 L 1245 458 L 1245 445 L 925 445 L 925 405" fill="none" stroke="#6D3FC0" stroke-width="2" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

    <rect x="190" y="765" width="1220" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="220" y="797" width="130" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="285" y="824" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">组合关系</text>
    <text x="385" y="824" font-size="18" font-weight="500" fill="#172033" text-anchor="start">Business Stage → Agentic Executor → 使用上方执行闭环</text>
    <text x="930" y="824" font-size="18" font-weight="500" fill="#172033" text-anchor="start">Agentic Workflow → Tool / API → 发起或查询下方 Workflow</text>
    <text x="800" y="855" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">可以相互调用，但不存在固定的外层、内层关系</text>

    <rect x="60" y="905" width="1480" height="600" rx="18" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <rect x="95" y="930" width="170" height="40" rx="20" fill="#C05A12" stroke="#C05A12" stroke-width="0"/>
<text x="180" y="957" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">流程导向</text>
    <text x="300" y="959" font-size="27" font-weight="500" fill="#172033" text-anchor="start">Business Workflow：流程定义与 Instance state 决定下一步</text>

    <rect x="95" y="1015" width="150" height="85" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="170" y="1050" font-size="20" font-weight="500" fill="#172033" text-anchor="middle">Trigger</text>
    <text x="170" y="1078" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">事件或业务输入</text>
    <path d="M 245 1058 L 300 1058" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="300" y="1005" width="230" height="105" rx="12" fill="#FFFFFF" stroke="#C05A12" stroke-width="2"/>
    <text x="415" y="1044" font-size="20" font-weight="500" fill="#172033" text-anchor="middle">创建或恢复</text>
    <text x="415" y="1074" font-size="17" font-weight="400" fill="#5F6B7A" text-anchor="middle">Workflow Instance</text>
    <path d="M 530 1058 L 590 1058" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" y="1005" width="220" height="105" rx="12" fill="#FFFFFF" stroke="#C05A12" stroke-width="2"/>
    <text x="700" y="1044" font-size="19" font-weight="500" fill="#172033" text-anchor="middle">计算 Ready Stage(s)</text>
    <text x="700" y="1074" font-size="16" font-weight="400" fill="#5F6B7A" text-anchor="middle">可顺序，也可并行</text>
    <path d="M 810 1058 L 870 1058" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="870" y="985" width="580" height="170" rx="14" fill="#FFFFFF" stroke="#C05A12" stroke-width="2"/>
    <text x="900" y="1022" font-size="20" font-weight="500" fill="#172033" text-anchor="start">调用当前 Stage 的 Executor</text>
    <rect x="900" y="1045" width="100" height="44" rx="8" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="950" y="1074" font-size="16" font-weight="500" fill="#172033" text-anchor="middle">Code</text>
    <rect x="1020" y="1045" width="150" height="44" rx="8" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1095" y="1074" font-size="16" font-weight="500" fill="#172033" text-anchor="middle">Tool / Service</text>
    <rect x="900" y="1100" width="190" height="42" rx="8" fill="#F3ECFF" stroke="#6D3FC0" stroke-width="2"/>
    <text x="995" y="1128" font-size="16" font-weight="500" fill="#6D3FC0" text-anchor="middle">Agentic Executor</text>
    <rect x="1110" y="1100" width="150" height="42" rx="8" fill="#FFF2E2" stroke="#C05A12" stroke-width="2"/>
    <text x="1185" y="1128" font-size="16" font-weight="500" fill="#C05A12" text-anchor="middle">Human Task</text>
    <text x="1355" y="1075" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">同一 Stage 契约</text>

    <path d="M 1315 1155 L 1315 1195" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1195" y="1195" width="255" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1323" y="1234" font-size="20" font-weight="500" fill="#172033" text-anchor="middle">统一 StageResult</text>
    <text x="1323" y="1264" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">status · output · evidence</text>
    <text x="1323" y="1287" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">artifacts · error</text>
    <path d="M 1195 1250 L 1135 1250" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="905" y="1195" width="230" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1020" y="1234" font-size="19" font-weight="500" fill="#172033" text-anchor="middle">持久化 Instance state</text>
    <text x="1020" y="1264" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">当前 Stage · 等待 · 结果</text>
    <text x="1020" y="1287" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">分支与完成状态</text>
    <path d="M 905 1250 L 845 1250" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="615" y="1195" width="230" height="110" rx="12" fill="#FFFFFF" stroke="#B93838" stroke-width="2"/>
    <text x="730" y="1234" font-size="20" font-weight="500" fill="#B93838" text-anchor="middle">Gate / Transition</text>
    <text x="730" y="1264" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">校验结果并解析状态迁移</text>
    <text x="730" y="1287" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">由流程定义决定去向</text>
    <path d="M 615 1250 L 565 1250" fill="none" stroke="#C05A12" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="95" y="1175" width="470" height="245" rx="14" fill="#FFFFFF" stroke="#C05A12" stroke-width="2"/>
    <text x="125" y="1212" font-size="19" font-weight="500" fill="#172033" text-anchor="start">Transition 结果</text>
    <rect x="125" y="1235" width="125" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="187.5" y="1262" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Next</text>
    <rect x="265" y="1235" width="125" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="327.5" y="1262" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Branch</text>
    <rect x="405" y="1235" width="125" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="467.5" y="1262" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Parallel / Join</text>
    <rect x="125" y="1290" width="125" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="187.5" y="1317" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Wait / Resume</text>
    <rect x="265" y="1290" width="125" height="40" rx="20" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="0"/>
<text x="327.5" y="1317" font-size="18" font-weight="500" fill="#172033" text-anchor="middle">Loop / Comp.</text>
    <rect x="405" y="1290" width="125" height="40" rx="20" fill="#EAF8EF" stroke="#EAF8EF" stroke-width="0"/>
<text x="467.5" y="1317" font-size="18" font-weight="500" fill="#15803D" text-anchor="middle">Complete</text>
    <text x="330" y="1372" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">Next · Branch · Parallel / Join · Wait / Resume</text>
    <text x="330" y="1396" font-size="15" font-weight="400" fill="#5F6B7A" text-anchor="middle">Loop / Compensation · Complete / Terminate</text>

    <path d="M 330 1175 L 330 1145 L 700 1145 L 700 1110" fill="none" stroke="#C05A12" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="500" y="1135" font-size="15" font-weight="500" fill="#C05A12" text-anchor="middle">未结束：重新计算 Ready Stage(s)</text>
    <rect x="610" y="1445" width="760" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="990" y="1471" font-size="17" font-weight="500" fill="#172033" text-anchor="middle">Orchestrator 按流程定义和 Instance state 持续推进，直到完成、终止或等待</text>

  </g>
</svg>
