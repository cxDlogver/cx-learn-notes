<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">AI 自动化测试整体架构</title>
  <desc id="desc">展示知识输入、测试平台五层、运行时适配和治理边界之间的组件关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <style>
      .title{font:600 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .panel-title{font:600 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .layer-title{font:600 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}
      .label{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054}
      .arrow{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#7A5AF8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#FFFFFF"/>
  <text x="60" y="58" class="title">AI 自动化测试整体架构</text>
  <text x="60" y="90" class="subtitle">业务语义、测试智能、执行资产、确定性运行和事实证据彼此解耦；治理约束覆盖所有层。</text>

  <rect x="50" y="140" width="245" height="770" rx="18" fill="#FFF8E8" stroke="#D58B1E" stroke-width="2"/>
  <text x="78" y="184" class="panel-title">知识与工程输入</text>
  <line x1="78" y1="205" x2="266" y2="205" stroke="#E7B45C"/>
  <g class="body">
    <circle cx="84" cy="250" r="5" fill="#D58B1E"/><text x="102" y="256">PRD / User Story</text>
    <circle cx="84" cy="310" r="5" fill="#D58B1E"/><text x="102" y="316">业务规则与风险</text>
    <circle cx="84" cy="370" r="5" fill="#D58B1E"/><text x="102" y="376">API / 数据契约</text>
    <circle cx="84" cy="430" r="5" fill="#D58B1E"/><text x="102" y="436">产品与测试代码</text>
    <circle cx="84" cy="490" r="5" fill="#D58B1E"/><text x="102" y="496">历史用例与缺陷</text>
    <circle cx="84" cy="550" r="5" fill="#D58B1E"/><text x="102" y="556">生产观测与风险</text>
  </g>
  <rect x="76" y="625" width="192" height="205" rx="12" fill="#FFFFFF" stroke="#E7B45C"/>
  <text x="96" y="660" class="label">输入要求</text>
  <text x="96" y="698" class="small">• 来源可追溯</text>
  <text x="96" y="732" class="small">• 版本可定位</text>
  <text x="96" y="766" class="small">• 歧义显式记录</text>
  <text x="96" y="800" class="small">• 敏感数据受控</text>

  <rect x="335" y="125" width="900" height="800" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="375" y="166" class="panel-title">AI 测试平台</text>
  <text x="1160" y="165" class="small" text-anchor="end">每层有独立输入、输出与验证方式</text>

  <rect x="375" y="190" width="820" height="115" rx="14" fill="#FFF7E8" stroke="#D58B1E" stroke-width="1.5"/>
  <text x="402" y="224" class="layer-title">1  Specification Layer｜稳定语义层</text>
  <text x="402" y="254" class="body">Requirement · Rule · BDD Scenario · Oracle · Risk · Coverage Link</text>
  <rect x="938" y="214" width="225" height="62" rx="10" fill="#FFFFFF" stroke="#E7B45C"/>
  <text x="1050" y="239" class="label" text-anchor="middle">不可静默改变</text>
  <text x="1050" y="262" class="small" text-anchor="middle">业务约束与关键断言</text>

  <rect x="375" y="325" width="820" height="115" rx="14" fill="#EAF2FF" stroke="#3973C6" stroke-width="1.5"/>
  <text x="402" y="359" class="layer-title">2  Test Intelligence Layer｜测试智能层</text>
  <text x="402" y="389" class="body">需求分析 · 因素建模 · 组合矩阵 · Case 生成 · 测试级别选择</text>
  <rect x="938" y="348" width="225" height="64" rx="10" fill="#FFFFFF" stroke="#8CB4EC"/>
  <text x="1050" y="374" class="label" text-anchor="middle">AI 生成与检查</text>
  <text x="1050" y="397" class="small" text-anchor="middle">输出必须可验证</text>

  <rect x="375" y="460" width="820" height="115" rx="14" fill="#F7F8FA" stroke="#98A2B3" stroke-width="1.5"/>
  <text x="402" y="494" class="layer-title">3  Execution Asset Layer｜执行资产层</text>
  <text x="402" y="524" class="body">Unit / API / E2E 脚本 · Fixture · Mock · 数据约束 · 环境配置</text>
  <rect x="938" y="483" width="225" height="64" rx="10" fill="#FFFFFF" stroke="#B8C0CC"/>
  <text x="1050" y="509" class="label" text-anchor="middle">语义与实现解耦</text>
  <text x="1050" y="532" class="small" text-anchor="middle">Binding 可维护</text>

  <rect x="375" y="595" width="820" height="125" rx="14" fill="#ECFDF3" stroke="#2A8F5B" stroke-width="1.5"/>
  <text x="402" y="629" class="layer-title">4  Deterministic Runtime｜确定性执行层</text>
  <text x="402" y="659" class="body">CI 调度 · Browser/API Runner · 数据与环境控制 · 确定性 Oracle</text>
  <rect x="900" y="620" width="263" height="72" rx="10" fill="#FFFFFF" stroke="#65B58A"/>
  <text x="1032" y="646" class="label" text-anchor="middle">Runtime Adaptation</text>
  <text x="1032" y="669" class="small" text-anchor="middle">定位、数据、场景与环境适配</text>
  <text x="1032" y="688" class="small" text-anchor="middle">受契约与预算约束</text>

  <rect x="375" y="740" width="820" height="145" rx="14" fill="#F4F1FF" stroke="#7A5AF8" stroke-width="1.5"/>
  <text x="402" y="774" class="layer-title">5  Evidence &amp; Quality Ledger｜证据与质量账本</text>
  <text x="402" y="804" class="body">Trace · DOM · Network · Log · Data State · Result · Defect · Audit Trail</text>
  <rect x="900" y="769" width="263" height="86" rx="10" fill="#FFFFFF" stroke="#A996F8"/>
  <text x="1032" y="795" class="label" text-anchor="middle">Coverage &amp; Failure Triage</text>
  <text x="1032" y="819" class="small" text-anchor="middle">覆盖回写 · 失败分类</text>
  <text x="1032" y="842" class="small" text-anchor="middle">置信度 · 反证 · 残余风险</text>

  <rect x="1275" y="140" width="275" height="770" rx="18" fill="#FFF3F1" stroke="#D92D20" stroke-width="2"/>
  <text x="1305" y="184" class="panel-title">Governance｜治理</text>
  <line x1="1305" y1="205" x2="1518" y2="205" stroke="#EA9A92"/>
  <g class="body">
    <rect x="1305" y="235" width="215" height="72" rx="10" fill="#FFFFFF" stroke="#F1B5AF"/>
    <text x="1412" y="265" class="label" text-anchor="middle">身份、权限、数据合规</text>
    <text x="1412" y="289" class="small" text-anchor="middle">谁能读、写、修复什么</text>
    <rect x="1305" y="330" width="215" height="72" rx="10" fill="#FFFFFF" stroke="#F1B5AF"/>
    <text x="1412" y="360" class="label" text-anchor="middle">自动修复策略</text>
    <text x="1412" y="384" class="small" text-anchor="middle">风险、预算、回滚边界</text>
    <rect x="1305" y="425" width="215" height="72" rx="10" fill="#FFFFFF" stroke="#F1B5AF"/>
    <text x="1412" y="455" class="label" text-anchor="middle">人工质量门槛</text>
    <text x="1412" y="479" class="small" text-anchor="middle">规范、Oracle、代码审查</text>
    <rect x="1305" y="520" width="215" height="72" rx="10" fill="#FFFFFF" stroke="#F1B5AF"/>
    <text x="1412" y="550" class="label" text-anchor="middle">审计与可重放</text>
    <text x="1412" y="574" class="small" text-anchor="middle">记录模型、证据和修改</text>
    <rect x="1305" y="615" width="215" height="72" rx="10" fill="#FFFFFF" stroke="#F1B5AF"/>
    <text x="1412" y="645" class="label" text-anchor="middle">发布门槛</text>
    <text x="1412" y="669" class="small" text-anchor="middle">回归、风险与审批</text>
  </g>
  <rect x="1305" y="740" width="215" height="105" rx="10" fill="#FFE5E1" stroke="#D92D20"/>
  <text x="1412" y="773" class="label" text-anchor="middle">禁止默认开放</text>
  <text x="1412" y="801" class="small" text-anchor="middle">放宽 Oracle</text>
  <text x="1412" y="827" class="small" text-anchor="middle">无证据报 PASS</text>

  <path d="M295 250 H355 V245 H375" class="arrow"/>
  <path d="M785 305 V325" class="arrow"/>
  <path d="M785 440 V460" class="arrow"/>
  <path d="M785 575 V595" class="arrow"/>
  <path d="M785 720 V740" class="arrow"/>
  <path d="M375 822 H330 V378 H375" class="feedback"/>
  <path d="M1195 655 H1238 V812 H1195" class="feedback"/>

  <rect x="335" y="950" width="900" height="55" rx="12" fill="#172033"/>
  <text x="785" y="984" text-anchor="middle" style="font:600 17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#FFFFFF">Specification Stable · Runtime Adaptive · Evidence Driven · Human Governed</text>
</svg>

