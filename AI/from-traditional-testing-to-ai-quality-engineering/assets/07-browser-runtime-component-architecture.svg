<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">浏览器运行时适配组件架构</title>
  <desc id="desc">展示控制平面、执行平面、证据决策平面、修复适配器和被测系统之间的组件边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7A5AF8"/>
    </marker>
    <style>
      .title{font:600 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .panel-title{font:600 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .component{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}
      .edge-label{font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}
      .arrow{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}
      .bi{fill:none;stroke:#64748B;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#7A5AF8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#purple-arrow)}
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#FFFFFF"/>
  <text x="60" y="58" class="title">浏览器运行时适配组件架构</text>
  <text x="60" y="90" class="subtitle">AI 负责证据解释和候选决策；确定性执行器负责动作与断言；策略引擎决定是否允许自动修复。</text>

  <rect x="70" y="130" width="1460" height="185" rx="18" fill="#FFF7E8" stroke="#D58B1E" stroke-width="2"/>
  <text x="100" y="168" class="panel-title">Control Plane｜控制平面</text>

  <g>
    <rect x="100" y="195" width="310" height="88" rx="12" fill="#FFFFFF" stroke="#E7B45C"/>
    <text x="255" y="227" class="component" text-anchor="middle">Scenario Orchestrator</text>
    <text x="255" y="252" class="body" text-anchor="middle">语义步骤编排 · 状态机 · 调度</text>
    <rect x="440" y="195" width="310" height="88" rx="12" fill="#FFFFFF" stroke="#E7B45C"/>
    <text x="595" y="227" class="component" text-anchor="middle">Contract Validator</text>
    <text x="595" y="252" class="body" text-anchor="middle">不变量 · Oracle · 禁止修改项</text>
    <rect x="780" y="195" width="310" height="88" rx="12" fill="#FFFFFF" stroke="#E7B45C"/>
    <text x="935" y="227" class="component" text-anchor="middle">Policy &amp; Budget Engine</text>
    <text x="935" y="252" class="body" text-anchor="middle">权限 · 置信度 · 次数 · 副作用</text>
    <rect x="1120" y="195" width="380" height="88" rx="12" fill="#FFFFFF" stroke="#E7B45C"/>
    <text x="1310" y="227" class="component" text-anchor="middle">Checkpoint &amp; Transaction Manager</text>
    <text x="1310" y="252" class="body" text-anchor="middle">安全检查点 · 锁定 · 回滚 · 清理</text>
  </g>

  <rect x="70" y="350" width="445" height="425" rx="18" fill="#EAF2FF" stroke="#3973C6" stroke-width="2"/>
  <text x="100" y="390" class="panel-title">Execution Plane｜执行平面</text>
  <rect x="100" y="420" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#8CB4EC"/>
  <text x="292" y="449" class="component" text-anchor="middle">Browser Runner</text>
  <text x="292" y="473" class="body" text-anchor="middle">Playwright · Locator · Actionability</text>
  <rect x="100" y="512" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#8CB4EC"/>
  <text x="292" y="541" class="component" text-anchor="middle">API &amp; Data Runner</text>
  <text x="292" y="565" class="body" text-anchor="middle">数据查询/创建 · 权限校验 · 清理</text>
  <rect x="100" y="604" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#8CB4EC"/>
  <text x="292" y="633" class="component" text-anchor="middle">Environment Controller</text>
  <text x="292" y="657" class="body" text-anchor="middle">部署版本 · 健康检查 · 依赖控制</text>
  <rect x="100" y="696" width="385" height="52" rx="11" fill="#DCEAFF" stroke="#3973C6"/>
  <text x="292" y="728" class="component" text-anchor="middle">Deterministic Oracle Evaluator</text>

  <rect x="575" y="350" width="445" height="425" rx="18" fill="#F4F1FF" stroke="#7A5AF8" stroke-width="2"/>
  <text x="605" y="390" class="panel-title">Evidence &amp; Decision Plane｜证据决策平面</text>
  <rect x="605" y="420" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#A996F8"/>
  <text x="797" y="449" class="component" text-anchor="middle">Evidence Collector</text>
  <text x="797" y="473" class="body" text-anchor="middle">DOM/Trace · Network · Log · Data/Env</text>
  <rect x="605" y="512" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#A996F8"/>
  <text x="797" y="541" class="component" text-anchor="middle">Evidence Store &amp; Correlator</text>
  <text x="797" y="565" class="body" text-anchor="middle">按运行、版本、Case 和检查点关联事实</text>
  <rect x="605" y="604" width="385" height="72" rx="11" fill="#FFFFFF" stroke="#A996F8"/>
  <text x="797" y="633" class="component" text-anchor="middle">Failure Classifier</text>
  <text x="797" y="657" class="body" text-anchor="middle">类别 · 置信度 · 支持证据 · 反证</text>
  <rect x="605" y="696" width="385" height="52" rx="11" fill="#E9E2FF" stroke="#7A5AF8"/>
  <text x="797" y="728" class="component" text-anchor="middle">Repair Planner</text>

  <rect x="1080" y="350" width="450" height="425" rx="18" fill="#ECFDF3" stroke="#2A8F5B" stroke-width="2"/>
  <text x="1110" y="390" class="panel-title">Repair Adapters｜受控修复适配器</text>
  <g>
    <rect x="1110" y="420" width="185" height="72" rx="11" fill="#FFFFFF" stroke="#65B58A"/>
    <text x="1202" y="449" class="component" text-anchor="middle">Locator Healer</text>
    <text x="1202" y="473" class="body" text-anchor="middle">动作绑定</text>
    <rect x="1315" y="420" width="185" height="72" rx="11" fill="#FFFFFF" stroke="#65B58A"/>
    <text x="1407" y="449" class="component" text-anchor="middle">Data Binder</text>
    <text x="1407" y="473" class="body" text-anchor="middle">候选与造数</text>
    <rect x="1110" y="512" width="185" height="72" rx="11" fill="#FFFFFF" stroke="#65B58A"/>
    <text x="1202" y="541" class="component" text-anchor="middle">UI Context</text>
    <text x="1202" y="565" class="body" text-anchor="middle">筛选/分页/导航</text>
    <rect x="1315" y="512" width="185" height="72" rx="11" fill="#FFFFFF" stroke="#65B58A"/>
    <text x="1407" y="541" class="component" text-anchor="middle">Env Recovery</text>
    <text x="1407" y="565" class="body" text-anchor="middle">重建/切换/停止</text>
    <rect x="1110" y="604" width="185" height="72" rx="11" fill="#FFFFFF" stroke="#65B58A"/>
    <text x="1202" y="633" class="component" text-anchor="middle">Code Patch Agent</text>
    <text x="1202" y="657" class="body" text-anchor="middle">隔离分支最小补丁</text>
    <rect x="1315" y="604" width="185" height="72" rx="11" fill="#FFF1F0" stroke="#D92D20"/>
    <text x="1407" y="633" class="component" text-anchor="middle">Human Gate</text>
    <text x="1407" y="657" class="body" text-anchor="middle">不确定/高风险/发布</text>
  </g>
  <rect x="1110" y="696" width="390" height="52" rx="11" fill="#DDF7E8" stroke="#2A8F5B"/>
  <text x="1305" y="728" class="component" text-anchor="middle">Audit Log · Rollback Handle · Repair Diff</text>

  <rect x="70" y="835" width="1460" height="150" rx="18" fill="#F7F8FA" stroke="#98A2B3" stroke-width="2"/>
  <text x="100" y="875" class="panel-title">System Under Test &amp; Engineering Systems｜被测系统与工程基础设施</text>
  <rect x="100" y="900" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#B8C0CC"/>
  <text x="255" y="935" class="component" text-anchor="middle">Browser / UI</text>
  <rect x="440" y="900" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#B8C0CC"/>
  <text x="595" y="935" class="component" text-anchor="middle">Application API / Services</text>
  <rect x="780" y="900" width="310" height="58" rx="10" fill="#FFFFFF" stroke="#B8C0CC"/>
  <text x="935" y="935" class="component" text-anchor="middle">Database / Test Data Service</text>
  <rect x="1120" y="900" width="380" height="58" rx="10" fill="#FFFFFF" stroke="#B8C0CC"/>
  <text x="1310" y="935" class="component" text-anchor="middle">CI · Deployment · Logging · Tracing</text>

  <path d="M255 283 V330 H292 V350" class="arrow"/>
  <path d="M595 283 V330 H797 V350" class="arrow"/>
  <path d="M935 283 V330 H1305 V350" class="arrow"/>
  <path d="M1310 283 V325 H460 V420" class="arrow"/>
  <path d="M515 550 H575" class="arrow"/>
  <text x="545" y="538" class="edge-label" text-anchor="middle">运行事实</text>
  <path d="M1020 640 H1080" class="arrow"/>
  <text x="1050" y="628" class="edge-label" text-anchor="middle">修复候选</text>
  <path d="M1080 722 H1045 V800 H292 V775" class="feedback"/>
  <text x="702" y="815" class="edge-label" text-anchor="middle">通过契约与策略校验后，从检查点重跑</text>
  <path d="M292 775 V900" class="bi"/>
  <path d="M797 775 V865 H935 V900" class="arrow"/>
  <path d="M1305 775 V900" class="bi"/>

  <rect x="70" y="1008" width="1460" height="34" rx="8" fill="#172033"/>
  <text x="800" y="1031" text-anchor="middle" style="font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#FFFFFF">AI 不直接拥有“判定通过”的权力：Oracle、契约校验、策略预算与审计共同构成边界。</text>
</svg>

